<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gîtes — La Lysardière</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="print.js"></script>
<style>
/* ── VARIABLES ── */
:root{
  --forest:#18534F;--forest-mid:#226D68;--gold:#D4AF6A;--gold-deep:#B8943A;
  --red:#c0392b;--green:#1a7a4a;--blue:#0077A8;
  --mint:#EEF7F5;--bg:#F5F3EE;--card:#FFFFFF;
  --text:#1a2e2c;--text-mid:#5C6B6A;--text-light:#8FA5A3;
  --border:#E5E0D6;--border-light:#EDE8E0;
  --shadow-sm:0 1px 3px rgba(24,83,79,0.08);
  --shadow-md:0 4px 16px rgba(24,83,79,0.12);
  --radius:14px;--radius-sm:10px;--radius-xs:7px;
  /* Gîtes colors */
  --hulotte:#2e7d32;--hulotte-bg:#e8f5e9;--hulotte-hl:rgba(76,175,80,0.35);
  --sixties:#ad1457;--sixties-bg:#fce4ec;--sixties-hl:rgba(240,98,146,0.35);
  --envolee:#f57f17;--envolee-bg:#fff8e1;--envolee-hl:rgba(255,193,7,0.45);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@700&display=swap');

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,var(--forest),var(--forest-mid));
  padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(24,83,79,0.25);
}
.header-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.header-brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.header-title{font-family:'Fraunces',serif;font-size:16px;color:var(--gold)}
.header-sub{font-size:8px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:8px}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.hdr-btn-ghost{background:rgba(255,255,255,0.12);color:white}
.hdr-btn-ghost:hover{background:rgba(255,255,255,0.22)}
.hdr-btn-primary{background:var(--gold);color:var(--forest)}
.hdr-btn-primary:hover{background:var(--gold-deep)}

/* ── MAIN ── */
.main{max-width:900px;margin:0 auto;padding:24px 16px 80px}

/* ── SELECTOR ── */
.selector-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.selector-card h2{font-family:'Fraunces',serif;font-size:16px;color:var(--forest);margin-bottom:14px}
.selector-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selector-row select{flex:1;min-width:200px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color 0.2s}
.selector-row select:focus{border-color:var(--forest-mid)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all 0.15s}
.btn-primary{background:linear-gradient(135deg,var(--forest),var(--forest-mid));color:white}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-print{background:var(--gold);color:var(--forest);padding:9px 20px}
.btn-print:hover{background:var(--gold-deep)}

/* ── LEGEND / GÎTES BUTTONS ── */
.legend{background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:none}
.legend h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-mid);margin-bottom:10px}
.gite-btns{display:flex;gap:8px;flex-wrap:wrap}
.gite-btn{padding:7px 16px;border-radius:20px;border:2px solid;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all 0.15s;user-select:none}
.gite-btn.hulotte{background:var(--hulotte-bg);border-color:var(--hulotte);color:var(--hulotte)}
.gite-btn.sixties{background:var(--sixties-bg);border-color:var(--sixties);color:var(--sixties)}
.gite-btn.envolee{background:var(--envolee-bg);border-color:var(--envolee);color:var(--envolee)}
.gite-btn.floridorlot{background:#e3f2fd;border-color:#1565c0;color:#1565c0}
.gite-btn.none{background:#f5f5f5;border-color:#bbb;color:#666}
.gite-btn.active{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.gite-btn:not(.active){opacity:0.55}

/* ── VACANCIERS LIST ── */
.vacanciers-section{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:none}
.vacanciers-section h3{font-family:'Fraunces',serif;font-size:15px;color:var(--forest);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.person-chip{
  padding:8px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);
  cursor:pointer;transition:all 0.15s;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.person-chip:hover{border-color:var(--forest-mid)}
.person-chip.hulotte{background:var(--hulotte-bg);border-color:var(--hulotte)}
.person-chip.sixties{background:var(--sixties-bg);border-color:var(--sixties)}
.person-chip.envolee{background:var(--envolee-bg);border-color:var(--envolee)}
.person-chip.floridorlot{background:#e3f2fd;border-color:#1565c0}
.person-name{font-size:13px;font-weight:600;color:var(--text)}
.person-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.person-chip.hulotte .person-tag{background:var(--hulotte);color:white}
.person-chip.sixties .person-tag{background:var(--sixties);color:white}
.person-chip.envolee .person-tag{background:var(--envolee);color:white}
.person-chip.floridorlot .person-tag{background:#1565c0;color:white}
.person-dir{font-size:10px;color:var(--text-mid)}

/* ── ACTIVE GITE INDICATOR ── */
.active-gite-bar{
  display:none;padding:8px 16px;border-radius:9px;margin-bottom:14px;font-size:13px;font-weight:600;
  align-items:center;gap:8px;
}
.active-gite-bar.hulotte{background:var(--hulotte-bg);color:var(--hulotte);border:1.5px solid var(--hulotte)}
.active-gite-bar.sixties{background:var(--sixties-bg);color:var(--sixties);border:1.5px solid var(--sixties)}
.active-gite-bar.envolee{background:var(--envolee-bg);color:var(--envolee);border:1.5px solid var(--envolee)}
.active-gite-bar.none{background:#f5f5f5;color:#666;border:1.5px solid #bbb}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px;color:var(--text-light);font-size:14px}

/* ── PRINT ── */
@media print{
  .header,.legend,.selector-card,.vacanciers-section,.no-print{display:none!important}
  body{background:white}
}
</style>
</head>
<body>

<div class="header">
  <a href="transport.html" class="header-brand">
    <img src="icon-192.png" alt="La Lysardière">
    <div>
      <div class="header-title">La Lysardière</div>
      <div class="header-sub">Annotation Gîtes</div>
    </div>
  </a>
  <div class="header-actions">
    <button class="hdr-btn hdr-btn-primary" id="btn-print" onclick="imprimerFiches()" style="display:none">🖨️ Imprimer les fiches annotées</button>
    <button class="hdr-btn hdr-btn-ghost" id="btn-gites" onclick="imprimerFeuillesGites()" style="display:none">📋 Feuilles départ par gîte</button>
    <button class="hdr-btn hdr-btn-ghost" id="btn-gites-arr" onclick="imprimerFeuillesArrivee()" style="display:none">🏡 Feuilles arrivée par gîte</button>
    <button class="hdr-btn hdr-btn-ghost" id="btn-affiches" onclick="imprimerAffichesVehicules()" style="display:none">🚐 Affiches véhicules</button>
    <a href="transport.html" class="hdr-btn hdr-btn-ghost">← Trajets</a>
  </div>
</div>

<div class="main">

  <!-- Sélection de la semaine -->
  <div class="selector-card">
    <h2>🗓️ Choisir une semaine</h2>
    <div class="selector-row">
      <select id="semaine-select" onchange="chargerSemaine()">
        <option value="">— Sélectionnez une semaine —</option>
      </select>
    </div>
    <div id="semaine-info" style="margin-top:10px;font-size:12px;color:var(--text-mid)"></div>
  </div>

  <!-- Sélection du gîte actif -->
  <div class="legend" id="legend-section">
    <h3>Gîtes — cliquez sur un gîte pour l'activer, puis cliquez sur les vacanciers</h3>
    <div class="gite-btns">
      <button class="gite-btn hulotte active" onclick="setActiveGite('hulotte')" id="gbtn-hulotte">Hulotte</button>
      <button class="gite-btn sixties active" onclick="setActiveGite('sixties')" id="gbtn-sixties">Sixties</button>
      <button class="gite-btn envolee active" onclick="setActiveGite('envolee')" id="gbtn-envolee">Envolée</button>
      <button class="gite-btn floridorlot active" onclick="setActiveGite('floridorlot')" id="gbtn-floridorlot">Floridorlot</button>
      <button class="gite-btn none active" onclick="setActiveGite('none')" id="gbtn-none">✕ Effacer</button>
    </div>
  </div>

  <!-- Barre gîte actif -->
  <div class="active-gite-bar" id="active-gite-bar"></div>

  <!-- Liste vacanciers -->
  <div class="vacanciers-section" id="vacanciers-section">
    <h3>👥 Vacanciers de la semaine <span id="vac-count" style="background:var(--mint);border-radius:20px;padding:2px 10px;font-size:12px;font-family:'DM Sans';font-weight:700"></span></h3>
    <div class="person-grid" id="person-grid"></div>
  </div>

</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
var SUPA_URL='https://lkqzifqeniblltniabai.supabase.co';
var SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcXppZnFlbmlibGx0bmlhYmFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NzU0NzcsImV4cCI6MjA4OTQ1MTQ3N30.AgXx5arpHjjbAkgbIC9u6tlRUhpSMW8iNP937pNpuX4';
var LOGO_URL='icon-192.png';

// ── ÉTAT ────────────────────────────────────────────────────────
var currentSemaine = null;   // données semaine chargée
var gites = {};              // { "Prénom NOM": 'hulotte'|'sixties'|'envolee'|null }
var activeGite = 'hulotte';  // gîte actuellement sélectionné dans la palette

var GITE_COLORS = {
  hulotte:  { label:'Hulotte', letter:'H', color:'#2e7d32', bg:'rgba(76,175,80,0.35)', badge:'#2e7d32', badgeBg:'#e8f5e9' },
  sixties:  { label:'Sixties', letter:'S', color:'#ad1457', bg:'rgba(240,98,146,0.35)', badge:'#ad1457', badgeBg:'#fce4ec' },
  envolee:     { label:'Envolée',    letter:'E', color:'#f57f17', bg:'rgba(255,193,7,0.45)',   badge:'#e65100', badgeBg:'#fff8e1' },
  floridorlot: { label:'Floridorlot', letter:'F', color:'#1565c0', bg:'rgba(66,165,245,0.28)',  badge:'#1565c0', badgeBg:'#e3f2fd' },
};

// ── SUPABASE ─────────────────────────────────────────────────────
async function supaFetch(path, method, body) {
  var url = SUPA_URL + '/rest/v1/' + path;
  var headers = { 'apikey': SUPA_ANON, 'Authorization': 'Bearer ' + SUPA_ANON, 'Content-Type': 'application/json' };
  var opts = { method: method || 'GET', headers: headers };
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(url, opts);
  if (!method || method === 'GET') return await r.json();
  return r.ok;
}

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  // Charger semaines + archives
  var rows = await supaFetch('semaines?select=*&order=updated_at.desc');
  var archives = await supaFetch('archives?select=*&order=updated_at.desc');
  var all = [...(rows||[]), ...(archives||[])];

  var sel = document.getElementById('semaine-select');
  all.forEach(function(row) {
    var s = row.data || row;
    if (!s || !s.convois || !s.convois.length) return;
    var opt = document.createElement('option');
    opt.value = row.id;
    var label = fmtDateShort(s.date) + ' — ' + (s.convois.length) + ' convoi(s)' + (s.label ? ' · ' + s.label : '');
    if (archives.some(function(a){return a.id===row.id})) label = '📦 ' + label;
    opt.textContent = label;
    opt._data = s;
    sel.appendChild(opt);
  });
}

// ── CHARGER SEMAINE ──────────────────────────────────────────────
function chargerSemaine() {
  var sel = document.getElementById('semaine-select');
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt._data) { currentSemaine = null; return; }
  currentSemaine = opt._data;

  // Restaurer gîtes depuis localStorage
  var key = 'gites_' + currentSemaine.date;
  gites = JSON.parse(localStorage.getItem(key) || '{}');

  // Infos
  document.getElementById('semaine-info').textContent =
    fmtDateLong(currentSemaine.date) + ' — ' + currentSemaine.convois.length + ' convoi(s)';

  // Afficher sections
  document.getElementById('legend-section').style.display = 'block';
  document.getElementById('vacanciers-section').style.display = 'block';
  document.getElementById('btn-print').style.display = 'inline-flex';
  document.getElementById('btn-gites').style.display = 'inline-flex';
  document.getElementById('btn-gites-arr').style.display = 'inline-flex';
  document.getElementById('btn-affiches').style.display = 'inline-flex';

  setActiveGite(activeGite);
  renderPersonGrid();
}

// ── GÎTE ACTIF ───────────────────────────────────────────────────
function setActiveGite(g) {
  activeGite = g;
  // Update buttons
  ['hulotte','sixties','envolee','floridorlot','none'].forEach(function(id) {
    var btn = document.getElementById('gbtn-' + id);
    if (!btn) return;
    if (id === g) {
      btn.classList.add('active');
      btn.style.opacity = '1';
      btn.style.transform = 'scale(1.05)';
    } else {
      btn.classList.remove('active');
      btn.style.opacity = '0.45';
      btn.style.transform = '';
    }
  });
  // Active bar
  var bar = document.getElementById('active-gite-bar');
  if (g === 'none') {
    bar.className = 'active-gite-bar none';
    bar.style.display = 'flex';
    bar.textContent = '✕ Mode effacer — cliquez sur un vacancier pour retirer son gîte';
  } else if (GITE_COLORS[g]) {
    bar.className = 'active-gite-bar ' + g;
    bar.style.display = 'flex';
    bar.textContent = 'Gîte actif : ' + GITE_COLORS[g].label + ' — cliquez sur les vacanciers pour les assigner';
  }
}

// ── AFFECTER UN GÎTE ─────────────────────────────────────────────
function assignGite(personKey) {
  if (activeGite === 'none') {
    delete gites[personKey];
  } else {
    gites[personKey] = activeGite;
  }
  // Sauvegarder
  if (currentSemaine) {
    localStorage.setItem('gites_' + currentSemaine.date, JSON.stringify(gites));
  }
  renderPersonGrid();
}

// ── LISTE VACANCIERS ─────────────────────────────────────────────
function getAllPersons() {
  if (!currentSemaine) return [];
  var seen = {};
  var persons = [];
  currentSemaine.convois.forEach(function(c) {
    (c.depart||[]).forEach(function(p) {
      var key = (p.prenom||'') + ' ' + ((p.nom||'').toUpperCase());
      if (!seen[key]) { seen[key] = true; persons.push({ key: key, prenom: p.prenom, nom: p.nom||'', dir: 'DEP' }); }
    });
    (c.arrivee||[]).forEach(function(p) {
      var key = (p.prenom||'') + ' ' + ((p.nom||'').toUpperCase());
      if (!seen[key]) { seen[key] = true; persons.push({ key: key, prenom: p.prenom, nom: p.nom||'', dir: 'ARR' }); }
    });
  });
  return persons.sort(function(a,b){ return a.key.localeCompare(b.key); });
}

function renderPersonGrid() {
  var persons = getAllPersons();
  document.getElementById('vac-count').textContent = persons.length + ' vacanciers';
  var html = persons.map(function(p) {
    var g = gites[p.key] || null;
    var chipClass = g ? ' ' + g : '';
    var tag = g ? '<span class="person-tag">' + GITE_COLORS[g].letter + '</span>' : '<span style="font-size:10px;color:#bbb">—</span>';
    return '<div class="person-chip' + chipClass + '" onclick="assignGite(\'' + p.key.replace(/'/g,"\\'") + '\')" title="Cliquer pour assigner au gîte actif">'
      + '<span class="person-name">' + p.prenom + ' ' + p.nom.toUpperCase() + '</span>'
      + tag
      + '</div>';
  }).join('');
  document.getElementById('person-grid').innerHTML = html || '<div class="empty">Aucun vacancier dans cette semaine.</div>';
}

// ── IMPRESSION ───────────────────────────────────────────────────
function imprimerFiches() {
  if (!currentSemaine) return;
  var dateLabel = fmtDateLong(currentSemaine.date);
  var html = generateFichesAnnoteesHTML(currentSemaine.convois, dateLabel);
  if (typeof openPrintWindow !== 'undefined') {
    openPrintWindow(html, { title: 'Fiches annotées — ' + dateLabel });
  }
}

// ── GÉNÉRATION HTML FICHES ANNOTÉES ─────────────────────────────
// ── GÉNÉRATION HTML FICHES ANNOTÉES ─────────────────────────────
function generateFichesAnnoteesHTML(convois, dateLabel) {
  return convois.map(function(c,i){ return generateFicheConvoi(c,i,dateLabel,convois); }).join('');
}

function generateFicheConvoi(c, i, dateLabel, convois) {
  var COLORS = ['#18534F','#D6955B','#226D68','#6B3FA0','#0077A8','#C0392B','#5d4037','#16a085','#8e6b3e','#1a7a4a','#c05020','#5b3a8b'];
  var PIQUENIQUE_HTML = '<div style="background:#C0392B;color:white;font-weight:700;font-size:12px;text-align:center;padding:8px 12px;border-radius:6px;margin:6px 0 6px 42px;letter-spacing:0.5px;border:2px solid #8B1A10">PAUSE PIQUE-NIQUE (1h)</div>';

  function fmtDur(min){ return Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'); }
  function fmtH(mins){ if(mins===undefined||mins===null) return ''; var h=Math.floor(mins/60)%24,m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
  function col(i){ return COLORS[i%COLORS.length]; }
  function getBadgeSt(t){ if(t==='rotation') return 'background:#FFF3E0;color:#c05020'; if(t==='depart_only') return 'background:#FDEDEC;color:#C0392B'; return 'background:#EAFAF1;color:#1a7a4a'; }
  function dp(a,b){ var R=6371,r=Math.PI/180,la1=parseFloat(a.lat),lo1=parseFloat(a.lng),la2=parseFloat(b.lat),lo2=parseFloat(b.lng); var x=Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
  function buildMapsUrl(c){ var wps=[]; c.stops.forEach(function(s){if(s.pt&&s.pt.lat) wps.push(s.pt.lat+','+s.pt.lng)}); return 'https://www.google.com/maps/dir/'+wps.join('/'); }
  function roundQ(withBuf,rawArr){ var rem=withBuf%15,r=rem<=7?withBuf-rem:withBuf+(15-rem); if(r-rawArr<10) r=withBuf-rem+15; return r; }

  function computeHeures(c){
    if(!c.heureDepart) return{heures:[],rawArrivals:[],piqueniqueIdx:-1,piqueniqueCount:0};
    var parts=c.heureDepart.split(':');
    var startMin=parseInt(parts[0])*60+parseInt(parts[1]);
    var useLeg=c.legDurations&&c.legDurations.length;
    var est=[];
    if(!useLeg&&c.stops&&c.stops.length>1){
      for(var ei=0;ei<c.stops.length-1;ei++){
        var a=c.stops[ei].pt,b=c.stops[ei+1].pt;
        if(a&&b&&a.lat&&b.lat) est.push({min:Math.round(dp(a,b)*1.3/50*60)});
        else est.push({min:15});
      }
    }
    var legs=useLeg?c.legDurations:est;
    if(!legs.length) return{heures:[],rawArrivals:[],piqueniqueIdx:-1,piqueniqueCount:0};
    var nb=legs.length+1,MIDI=720,pqIdx=-1;
    if(startMin<MIDI){
      var sd=startMin,sa=[startMin];
      for(var si=0;si<legs.length;si++){var arr=sd+legs[si].min;sa.push(arr);if(si<legs.length-1) sd=roundQ(arr+15,arr);}
      if(sa[nb-1]>MIDI){
        var bi=-1,bs=Infinity;
        for(var j=1;j<nb-1;j++){var sc=Math.abs(sa[j]-MIDI);if(sa[j]>810) sc+=500;if(sc<bs){bs=sc;bi=j;}}
        if(bi>0) pqIdx=bi;
      }
    }
    var heures=[],raw=[];
    heures[0]=startMin;raw[0]=startMin;
    var dp2=startMin;
    for(var m=1;m<nb;m++){
      var ra=dp2+legs[m-1].min;raw[m]=ra;
      if(m===nb-1){heures[m]=ra;continue;}
      var isPQ=(m===pqIdx),rdv=roundQ(ra+(isPQ?60:15),ra);

// ── UTILITAIRES ──────────────────────────────────────────────────
function fmtDateShort(d) {
  if (!d) return '';
  try { return new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch(e){ return d; }
}
function fmtDateLong(d) {
  if (!d) return '';
  try { return new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return d; }
}

  var GITE_STYLE = {
    hulotte:     { color:'#2e7d32', bg:'#e8f5e9', border:'#2e7d32' },
    sixties:     { color:'#ad1457', bg:'#fce4ec', border:'#ad1457' },
    envolee:     { color:'#e65100', bg:'#fff8e1', border:'#f57f17' },
    floridorlot: { color:'#1565c0', bg:'#e3f2fd', border:'#1565c0' },
  };

  var pages = [];

  ['hulotte','sixties','envolee','floridorlot'].forEach(function(gite) {
    var gc = GITE_STYLE[gite];
    var giteName = GITE_NAMES[gite];

    var convoisAvecGite = [];
    currentSemaine.convois.forEach(function(c) {
      var vacs = (c.depart||[]).filter(function(p) {
        return gites[(p.prenom||'')+' '+((p.nom||'').toUpperCase())] === gite;
      });
      if (vacs.length) convoisAvecGite.push({ convoi:c, vacanciers:vacs });
    });

    // Trier par heure de départ croissante
    convoisAvecGite.sort(function(a, b) {
      var ha = a.convoi.heureDepart || '99:99';
      var hb = b.convoi.heureDepart || '99:99';
      return ha.localeCompare(hb);
    });
    if (!convoisAvecGite.length) return;

    // Compter le nb total de lignes (1 par convoi header + 1 par vacancier + 1 total)
    var totalLines = convoisAvecGite.reduce(function(s,i){ return s + 1 + i.vacanciers.length + 1; }, 0) + 1; // +1 titre

    var inner = '';

    // Titre
    inner += '<div style="text-align:center;margin-bottom:16px">'
      + '<div style="display:inline-block;background:'+gc.bg+';border:3px solid '+gc.border+';border-radius:12px;padding:8px 36px">'
      + '<div style="font-size:28px;font-weight:900;color:'+gc.color+';letter-spacing:1px;font-family:Georgia,serif">'+giteName+'</div>'
      + '</div>'
      + '</div>';

    convoisAvecGite.forEach(function(item) {
      var c = item.convoi, vacs = item.vacanciers;
      var conducteur = c.conducteur||'—', heure = c.heureDepart||'—', vehicule = c.vehicule?c.vehicule.label:'Véhicule';
      inner += '<div style="margin-bottom:10px;border:1.5px solid #ddd;border-radius:8px;overflow:hidden">';
      inner += '<div style="background:#f5f5f5;border:1.5px solid #ccc;border-bottom:2.5px solid '+gc.border+';padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">'
        + '<span style="color:#1a2e2c;font-size:16px;font-weight:900;letter-spacing:0.5px">🚐 '+vehicule+'</span>'
        + '<div style="display:flex;align-items:center;gap:12px">'
        + (conducteur!=='—'?'<span style="color:#666;font-size:12px">👤 '+conducteur+'</span>':'')
        + '<span style="color:#C0392B;font-size:17px;font-weight:900;border:2px solid #C0392B;border-radius:8px;padding:2px 12px;letter-spacing:1px">'+heure+'</span>'
        + '</div>'
        + '</div>';
      vacs.forEach(function(p, pi) {
        inner += '<div style="padding:5px 14px;background:'+(pi%2?'white':'#f9f9f9')+';display:flex;align-items:center;gap:10px">'
          + '<span style="color:'+gc.color+';font-weight:700;font-size:11px;width:18px;text-align:right">'+(pi+1)+'</span>'
          + '<span style="font-size:13px;font-weight:700;color:#1a2e2c">'+p.prenom+' '+(p.nom||'').toUpperCase()+'</span>'
          + (p.foyer?'<span style="font-size:10px;color:#888;margin-left:auto">'+p.foyer+'</span>':'')
          + '</div>';
      });
      inner += '<div style="padding:4px 14px;border-top:1px solid #eee;background:#f5f5f5;text-align:right;font-size:10px;color:#555">'+vacs.length+' vacancier'+(vacs.length>1?'s':'')+'</div>';
      inner += '</div>';
    });

    var totalVacs = convoisAvecGite.reduce(function(s,i){return s+i.vacanciers.length;},0);
    inner += '<div style="text-align:center;font-size:11px;color:#888;margin-top:6px">'+totalVacs+' vacancier'+(totalVacs>1?'s':'')+' au gîte '+giteName+'</div>';

    pages.push(inner);
  });

  if (!pages.length) return;

  // Envelopper chaque page dans un div A4 avec scale-to-fit
  var html = pages.map(function(inner, idx) {
    var isLast = idx === pages.length - 1;
    return '<div class="lys-page" style="'+(isLast?'':'page-break-after:always;')+'width:210mm;height:297mm;overflow:hidden;position:relative;box-sizing:border-box">'
      + '<div class="lys-inner" style="position:absolute;top:0;left:0;width:210mm;transform-origin:top left;padding:16mm 14mm;box-sizing:border-box">'
      + inner
      + '</div></div>';
  }).join('');

  var fullHtml = '<style>@page{size:A4 portrait;margin:0}body{margin:0;padding:0}.lys-page{margin:0;padding:0}</style>'
    + html
    + '<script>'
    + 'window.addEventListener("load",function(){'
    + '  document.querySelectorAll(".lys-page").forEach(function(page){'
    + '    var inner=page.querySelector(".lys-inner");'
    + '    var ph=page.offsetHeight,iw=inner.scrollWidth,ih=inner.scrollHeight;'
    + '    var scaleX=(page.offsetWidth)/iw,scaleY=ph/ih,scale=Math.min(scaleX,scaleY,1);'
    + '    inner.style.transform="scale("+scale+")";'
    + '  });'
    + '  setTimeout(function(){window.print();},600);'
    + '});'
    + '<\/script>';

  if (typeof openPrintWindow !== 'undefined') {
    openPrintWindow(fullHtml, { title:'Feuilles départ par gîte' });
  }
}

// ── FEUILLES D'ARRIVÉE PAR GÎTE ─────────────────────────────────
// ── FEUILLES D'ARRIVÉE PAR GÎTE ─────────────────────────────────
function imprimerFeuillesArrivee() {
  if (!currentSemaine) return;

  var GITE_NAMES = { hulotte:'Hulotte', sixties:'Sixties', envolee:'Envolée', floridorlot:'Floridorlot' };
  var GITE_STYLE = {
    hulotte:     { color:'#2e7d32', bg:'#e8f5e9', border:'#2e7d32' },
    sixties:     { color:'#ad1457', bg:'#fce4ec', border:'#ad1457' },
    envolee:     { color:'#e65100', bg:'#fff8e1', border:'#f57f17' },
    floridorlot: { color:'#1565c0', bg:'#e3f2fd', border:'#1565c0' },
  };

  // Tailles selon nombre de vacanciers (max 12, lisible de loin)
  // A4 dispo ~237mm après marges 16mm top+bottom+30mm titre
  function sizes(n) {
    // nameSize en pt, paddingV en pt
    if (n <= 4)  return { name: 36, pad: 16 };
    if (n <= 6)  return { name: 30, pad: 12 };
    if (n <= 8)  return { name: 26, pad: 10 };
    if (n <= 10) return { name: 22, pad:  8 };
    return            { name: 18, pad:  6 };
  }

  var html = '';

  ['hulotte','sixties','envolee','floridorlot'].forEach(function(gite) {
    var gc = GITE_STYLE[gite];
    var giteName = GITE_NAMES[gite];

    var seen = {}, vacanciers = [];
    currentSemaine.convois.forEach(function(c) {
      (c.arrivee||[]).forEach(function(p) {
        var key = (p.prenom||'')+' '+((p.nom||'').toUpperCase());
        if (gites[key] === gite && !seen[key]) {
          seen[key] = true;
          vacanciers.push({ prenom: p.prenom, nom: (p.nom||'').toUpperCase() });
        }
      });
    });

    if (!vacanciers.length) return;
    vacanciers.sort(function(a,b){ return a.nom.localeCompare(b.nom)||a.prenom.localeCompare(b.prenom); });

    var n = vacanciers.length;
    var sz = sizes(n);

    html += '<div style="page-break-after:always;page-break-inside:avoid;'
      + 'padding:16mm 16mm;font-family:Arial,Helvetica,sans-serif;background:white;'
      + 'height:265mm;box-sizing:border-box;display:flex;flex-direction:column;">';

    // Titre grand et centré
    html += '<div style="text-align:center;margin-bottom:10mm;flex-shrink:0">'
      + '<div style="display:inline-block;background:'+gc.bg+';border:4pt solid '+gc.border+';border-radius:14pt;padding:10pt 48pt">'
      + '<div style="font-size:44pt;font-weight:900;color:'+gc.color+';letter-spacing:2pt;font-family:Georgia,serif">'+giteName+'</div>'
      + '</div></div>';

    // Liste — flex:1, espace réparti uniformément
    html += '<div style="flex:1;display:flex;flex-direction:column;justify-content:space-evenly">';
    vacanciers.forEach(function(p, i) {
      html += '<div style="background:'+(i%2===0?gc.bg:'white')+';border-radius:8pt;'
        + 'padding:'+sz.pad+'pt 20pt;border:1pt solid #ddd;'
        + 'display:flex;align-items:center;gap:14pt">'
        + '<span style="color:'+gc.color+';font-size:'+(sz.name*0.7)+'pt;font-weight:700;width:24pt;text-align:right;flex-shrink:0;opacity:0.7">'+(i+1)+'</span>'
        + '<span style="font-size:'+sz.name+'pt;font-weight:800;color:#1a2e2c;letter-spacing:0.5pt">'+p.prenom+' '+p.nom+'</span>'
        + '</div>';
    });
    html += '</div>';

    // Total discret
    html += '<div style="text-align:center;margin-top:4mm;flex-shrink:0;font-size:10pt;color:#bbb">'
      + n + ' vacancier'+(n>1?'s':'')+' attendu'+(n>1?'s':'')+'</div>';

    html += '</div>';
  });

  if (!html) return;
  if (typeof openPrintWindow !== 'undefined') {
    openPrintWindow(html, { title:'Feuilles arrivée par gîte' });
  }
}

// ── AFFICHES VÉHICULES (PAYSAGE) ────────────────────────────────
function imprimerAffichesVehicules() {
  if (!currentSemaine) return;

  var GITE_NAMES = { hulotte:'Hulotte', sixties:'Sixties', envolee:'Envolée', floridorlot:'Floridorlot' };
  var GITE_STYLE = {
    hulotte:     { color:'#2e7d32', bg:'#e8f5e9', border:'#2e7d32' },
    sixties:     { color:'#ad1457', bg:'#fce4ec', border:'#ad1457' },
    envolee:     { color:'#e65100', bg:'#fff8e1', border:'#f57f17' },
    floridorlot: { color:'#1565c0', bg:'#e3f2fd', border:'#1565c0' },
  };
  var GITE_ORDER = ['hulotte','sixties','envolee','floridorlot'];

  var html = '';

  currentSemaine.convois.forEach(function(c, idx) {
    var vehicule  = c.vehicule ? c.vehicule.label : 'Véhicule ' + (idx+1);
    var heure     = c.heureDepart || '';
    var conducteur = c.conducteur || '';

    // Regrouper les vacanciers en départ par gîte
    var byGite = {};
    GITE_ORDER.forEach(function(g){ byGite[g] = []; });
    var sansGite = [];

    (c.depart||[]).forEach(function(p) {
      var key = (p.prenom||'') + ' ' + ((p.nom||'').toUpperCase());
      var g = gites[key] || null;
      if (g && byGite[g]) byGite[g].push(p);
      else sansGite.push(p);
    });

    // Nombre total de vacanciers pour adapter taille
    var total = (c.depart||[]).length;
    var nameSize = total <= 4  ? 28
                 : total <= 6  ? 24
                 : total <= 8  ? 20
                 : total <= 12 ? 17
                 : 14;

    // Page paysage : 297mm × 210mm
    html += '<div style="page-break-after:always;page-break-inside:avoid;'
      + 'width:277mm;height:190mm;box-sizing:border-box;padding:10mm 14mm;'
      + 'font-family:Arial,Helvetica,sans-serif;background:white;'
      + 'display:flex;flex-direction:column;align-items:center;justify-content:center">';

    // ── BLOC CENTRAL : Véhicule + Heure ──
    html += '<div style="text-align:center;margin-bottom:8mm">';

    // Nom véhicule — très grand
    html += '<div style="font-size:52pt;font-weight:900;color:#18534F;letter-spacing:1pt;line-height:1;font-family:Georgia,serif">'
      + vehicule + '</div>';

    // Heure — rouge, gros
    if (heure) {
      html += '<div style="display:inline-block;color:#C0392B;font-size:38pt;font-weight:900;'
        + 'border:3pt solid #C0392B;border-radius:12pt;padding:4pt 28pt;margin-top:6pt;letter-spacing:3pt">'
        + heure + '</div>';
    }

    // Conducteur
    if (conducteur) {
      html += '<div style="font-size:14pt;color:#888;margin-top:4pt">👤 ' + conducteur + '</div>';
    }

    html += '</div>'; // fin bloc central

    // ── VACANCIERS PAR GÎTE ──
    html += '<div style="width:100%;display:flex;gap:6mm;justify-content:center;flex-wrap:wrap">';

    var hasAny = false;
    GITE_ORDER.forEach(function(g) {
      var vacs = byGite[g];
      if (!vacs.length) return;
      hasAny = true;
      var gc = GITE_STYLE[g];
      html += '<div style="background:'+gc.bg+';border:2.5pt solid '+gc.border+';border-radius:10pt;padding:6pt 14pt;min-width:100pt">';
      html += '<div style="font-size:11pt;font-weight:800;color:'+gc.color+';text-transform:uppercase;letter-spacing:1pt;margin-bottom:4pt;border-bottom:1.5pt solid '+gc.border+';padding-bottom:3pt">'
        + GITE_NAMES[g] + '</div>';
      vacs.forEach(function(p) {
        html += '<div style="font-size:'+nameSize+'pt;font-weight:700;color:#1a2e2c;line-height:1.4">'
          + p.prenom + ' ' + (p.nom||'').toUpperCase() + '</div>';
      });
      html += '</div>';
    });

    // Vacanciers sans gîte
    if (sansGite.length) {
      html += '<div style="background:#f5f5f5;border:2pt dashed #bbb;border-radius:10pt;padding:6pt 14pt;min-width:100pt">';
      html += '<div style="font-size:11pt;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1pt;margin-bottom:4pt">Non classés</div>';
      sansGite.forEach(function(p) {
        html += '<div style="font-size:'+nameSize+'pt;font-weight:700;color:#555;line-height:1.4">'
          + p.prenom + ' ' + (p.nom||'').toUpperCase() + '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // fin vacanciers
    html += '</div>'; // fin page
  });

  if (!html) return;

  // CSS paysage
  var fullHtml = '<style>'
    + '@page{size:A4 landscape;margin:10mm 10mm}'
    + 'body{margin:0;padding:0;background:white}'
    + '</style>'
    + html;

  if (typeof openPrintWindow !== 'undefined') {
    openPrintWindow(fullHtml, { title:'Affiches véhicules' });
  }
}

init();
</script>
