<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi & Gîtes — La Lysardière</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="print.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --f:#18534F;--fm:#226D68;--fl:#2d8a7f;
  --gold:#C9A84C;--gold-l:#F0DFA0;
  --bg:#F0EDE6;--card:#FFFFFF;--card2:#F8F6F2;
  --text:#1C2B29;--mid:#5A7270;--light:#9AB0AE;
  --border:#DDD8CE;--border-l:#EAE6DF;
  --red:#B83232;--red-bg:#FDF0F0;
  --green:#1a7a4a;--green-bg:#edfbf2;
  --orange:#C05C1A;--orange-bg:#FEF3E8;
  --sh:0 2px 8px rgba(28,43,41,.07);
  --sh-md:0 8px 32px rgba(28,43,41,.12);
  --sh-lg:0 20px 60px rgba(28,43,41,.18);
  --r:16px;--rs:10px;--rx:7px;
  /* Gîtes */
  --hu:#2E7D32;--hu-l:#E8F5E9;--hu-m:#A5D6A7;
  --si:#AD1457;--si-l:#FCE4EC;--si-m:#F48FB1;
  --en:#E65100;--en-l:#FFF3E0;--en-m:#FFCC80;
  --fl-c:#6A1B9A;--fl-l:#F3E5F5;--fl-m:#CE93D8;
  --ar:#1565C0;--ar-l:#E3F2FD;--ar-m:#90CAF9;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{background:var(--f);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:300;box-shadow:0 1px 0 rgba(255,255,255,.08),0 4px 20px rgba(0,0,0,.2)}
.hdr-brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.hdr-brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);opacity:.95}
.hdr-brand-text .title{font-family:'Fraunces',serif;font-size:15px;color:var(--gold);letter-spacing:.3px;line-height:1}
.hdr-brand-text .sub{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn-hdr{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.btn-ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.btn-gold{background:var(--gold);color:var(--f);font-weight:700}
.btn-gold:hover{background:#B8943A}

/* ── MAIN ── */
.main{max-width:1200px;margin:0 auto;padding:28px 20px 100px}

/* ── PAGE TITLE ── */
.page-eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--light);margin-bottom:6px}
.page-heading{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--text);margin-bottom:24px;line-height:1.1}

/* ── GITE CARDS GRID ── */
.gites-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:40px}
@media(max-width:720px){.gites-grid{grid-template-columns:1fr}}

.gite-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border-l);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.gite-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}

/* Accent bar left */
.gite-card-inner{display:flex;flex:1}
.gite-accent{width:5px;flex-shrink:0;border-radius:0}
.gite-content{flex:1;display:flex;flex-direction:column;min-width:0}

/* Gite header */
.gite-hdr{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-l)}
.gite-hdr-left{display:flex;align-items:center;gap:10px}
.gite-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.gite-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;letter-spacing:.2px}
.gite-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px}

/* Gite colors */
.hu .gite-accent{background:var(--hu);width:6px} .hu .gite-dot{background:var(--hu)} .hu .gite-hdr{background:var(--hu-l)} .hu .gite-title{color:var(--hu)} .hu .gite-badge{background:var(--hu);color:#fff}
.si .gite-accent{background:var(--si);width:6px} .si .gite-dot{background:var(--si)} .si .gite-hdr{background:var(--si-l)} .si .gite-title{color:var(--si)} .si .gite-badge{background:var(--si);color:#fff}
.en .gite-accent{background:var(--en);width:6px} .en .gite-dot{background:var(--en)} .en .gite-hdr{background:var(--en-l)} .en .gite-title{color:var(--en)} .en .gite-badge{background:var(--en);color:#fff}
.fl .gite-accent{background:var(--fl-c);width:6px} .fl .gite-dot{background:var(--fl-c)} .fl .gite-hdr{background:var(--fl-l)} .fl .gite-title{color:var(--fl-c)} .fl .gite-badge{background:var(--fl-c);color:#fff}
.ar .gite-accent{background:var(--ar);width:6px} .ar .gite-dot{background:var(--ar)} .ar .gite-hdr{background:var(--ar-l)} .ar .gite-title{color:var(--ar)} .ar .gite-badge{background:var(--ar);color:#fff}
.hu .vac-av{background:var(--hu)} .si .vac-av{background:var(--si)} .en .vac-av{background:var(--en)} .fl .vac-av{background:var(--fl-c)} .ar .vac-av{background:var(--ar)}

/* Gite body */
.gite-body{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.field-row{display:flex;align-items:center;gap:8px}
.field-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--light);width:70px;flex-shrink:0}
.field-in{flex:1;min-width:0;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;overflow:hidden;text-overflow:ellipsis}
.field-in:focus{border-color:var(--fm);background:#fff}
.field-col{display:flex;flex-direction:column;gap:5px}

/* Vehicles */
.vehs{display:flex;flex-wrap:wrap;gap:5px}
.veh-chip{display:inline-flex;align-items:center;gap:4px;background:#f0f5f4;border:1px solid #c8deda;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--f)}
.veh-chip button{background:none;border:none;cursor:pointer;color:var(--light);font-size:11px;line-height:1;padding:0;display:flex;align-items:center}
.veh-chip button:hover{color:var(--red)}
.veh-add{display:flex;gap:6px;margin-top:2px}
.veh-add select{flex:1;padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);outline:none}
.veh-add button{padding:5px 12px;background:var(--f);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:background .15s}
.veh-add button:hover{background:var(--fm)}

/* Animateurs bulles */
.anim-bubbles{display:flex;flex-wrap:wrap;gap:5px}
.anim-bubble{display:inline-flex;align-items:center;gap:5px;background:#eef7f5;border:1.5px solid #c8e8e2;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--f);cursor:pointer;transition:all .15s}
.anim-bubble:hover{background:#c8e8e2}
.anim-bubble button{background:none;border:none;cursor:pointer;color:var(--light);font-size:11px;padding:0;display:flex;align-items:center}
.anim-bubble button:hover{color:var(--red)}
.anim-search-wrap{position:relative;margin-top:4px}
.anim-search{width:100%;padding:5px 10px;border:1.5px dashed var(--border);border-radius:8px;font-size:12px;font-family:inherit;outline:none;background:var(--bg);color:var(--text);transition:border-color .2s}
.anim-search:focus{border-color:var(--fm);border-style:solid;background:#fff}
.anim-drop{display:none;position:absolute;left:0;right:0;top:calc(100% + 3px);background:#fff;border:1.5px solid var(--border);border-radius:9px;box-shadow:var(--sh-md);max-height:180px;overflow-y:auto;z-index:200}
.anim-drop-item{padding:8px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-l);display:flex;justify-content:space-between;align-items:center}
.anim-drop-item:last-child{border-bottom:none}
.anim-drop-item:hover{background:#f0f5f4}

/* Divider */
.gite-divider{height:1px;background:var(--border-l);margin:0 20px}

/* Vacanciers */
.vacs-section{padding:12px 20px 16px}
.vacs-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--light);margin-bottom:8px}
.vac-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-l)}
.vac-row:last-child{border-bottom:none}
.vac-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.vac-name{font-size:13px;font-weight:600;flex:1;min-width:0}
.vac-foyer{font-size:10px;color:var(--light)}
.st-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.st-complete{background:var(--green-bg);color:var(--green)}
.st-partial{background:var(--orange-bg);color:var(--orange)}
.st-empty{background:var(--red-bg);color:var(--red)}
.vac-btn{background:#f0f5f4;border:1px solid #c8deda;color:var(--f);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:2px;transition:background .15s}
.vac-btn:hover{background:#c8deda}
.vac-btn-del{background:var(--red-bg);border-color:#f5c6c6;color:var(--red)}
.vac-btn-del:hover{background:#f5c6c6}
.gite-empty{text-align:center;padding:18px 16px;color:var(--light);font-size:12px}

/* Manual add */
.manual-add-wrap{padding:8px 20px 14px;border-top:1px solid var(--border-l)}

/* ── SECTION NON ASSIGNÉS ── */
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;margin-top:32px}
.section-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text)}
.section-badge{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--mid)}

/* Palette */
.palette{background:var(--card);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;border:1px solid var(--border-l);box-shadow:var(--sh);display:none}
.palette-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--light);margin-bottom:10px}
.palette-btns{display:flex;gap:7px;flex-wrap:wrap}
.p-btn{padding:7px 16px;border-radius:20px;border:2px solid;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .15s;user-select:none}
.p-btn.hu{background:var(--hu-l);border-color:var(--hu);color:var(--hu)}
.p-btn.si{background:var(--si-l);border-color:var(--si);color:var(--si)}
.p-btn.en{background:var(--en-l);border-color:var(--en);color:var(--en)}
.p-btn.fl{background:var(--fl-l);border-color:var(--fl-c);color:var(--fl-c)}
.p-btn.ar{background:var(--ar-l);border-color:var(--ar);color:var(--ar)}
.p-btn.none{background:#f3f4f6;border-color:#bbb;color:#666}

.active-bar{display:none;padding:8px 16px;border-radius:9px;margin-bottom:12px;font-size:13px;font-weight:600;align-items:center;gap:8px;border:1.5px solid}
.active-bar.hu{background:var(--hu-l);color:var(--hu);border-color:var(--hu)}
.active-bar.si{background:var(--si-l);color:var(--si);border-color:var(--si)}
.active-bar.en{background:var(--en-l);color:var(--en);border-color:var(--en)}
.active-bar.fl{background:var(--fl-l);color:var(--fl-c);border-color:var(--fl-c)}
.active-bar.ar{background:var(--ar-l);color:var(--ar);border-color:var(--ar)}
.active-bar.none{background:#f3f4f6;color:#666;border-color:#bbb}

/* Non assignés grid */
.unassigned-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.person-chip{padding:9px 14px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.person-chip:hover{border-color:var(--fm);background:#eef7f5;transform:translateY(-1px)}
.chip-name{font-size:13px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Empty */
.empty-state{text-align:center;padding:40px 20px;color:var(--light);font-size:14px}

/* ── ARCHIVES ── */
.archives-section{margin-top:48px;border-top:2px solid var(--border);padding-top:28px}
.archive-sel-card{background:linear-gradient(135deg,var(--f),var(--fm));border-radius:var(--r);padding:20px 24px;margin-bottom:20px;box-shadow:var(--sh-md)}
.archive-sel-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.archive-sel{width:100%;padding:10px 14px;border:none;border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;font-weight:600;cursor:pointer}
.archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.archive-card{background:var(--card);border-radius:var(--rs);border:1px solid var(--border-l);overflow:hidden;box-shadow:var(--sh)}
.archive-card-hdr{padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.archive-card-name{font-family:'Fraunces',serif;font-size:15px;font-weight:700}
.archive-card-date{font-size:10px;opacity:.6}
.archive-card-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mid)}
.archive-vac{font-size:12px;padding:3px 0;color:var(--text)}

/* ── MODALE IMPRESSION ── */
.mi-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.mi-overlay.open{display:flex}
.mi-box{background:var(--card);border-radius:var(--r);padding:28px;width:100%;max-width:420px;box-shadow:var(--sh-lg)}
.mi-title{font-family:'Fraunces',serif;font-size:20px;color:var(--text);margin-bottom:4px}
.mi-sub{font-size:12px;color:var(--light);margin-bottom:22px}
.mi-btn{width:100%;padding:13px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:all .15s;text-align:left}
.mi-btn-green{background:var(--f);color:#fff}
.mi-btn-green:hover{background:var(--fm)}
.mi-btn-outline{background:var(--bg);border:1.5px solid var(--border);color:var(--text)}
.mi-btn-outline:hover{background:#eef7f5;border-color:var(--fm)}
.mi-sep{height:1px;background:var(--border-l);margin:14px 0 12px}
.mi-sel{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;margin-bottom:10px;color:var(--text);background:var(--bg)}
.mi-sel:focus{border-color:var(--fm)}
.mi-close{width:100%;padding:10px;background:transparent;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--mid);margin-top:4px}
.mi-close:hover{background:var(--bg)}
.toast{position:fixed;bottom:24px;right:20px;background:var(--f);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:var(--sh-md)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <a href="index.html" class="hdr-brand">
    <img src="icon-192.png" alt="">
    <div class="hdr-brand-text">
      <div class="title">La Lysardière</div>
      <div class="sub">Suivi & Gîtes</div>
    </div>
  </a>
  <div class="hdr-right">
    <button class="btn-hdr btn-gold" onclick="ouvrirModalImpression()">🖨️ Imprimer</button>
    <a href="index.html" class="btn-hdr btn-ghost">← Accueil</a>
  </div>
</div>

<div class="main" id="main" style="display:none">

  <div class="page-eyebrow">La Lysardière · Saison 2026</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div class="page-heading" style="margin-bottom:0">Gîtes & Suivi</div>
    <button id="btn-floridorlot" onclick="toggleFloridorlot()"
      style="display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:20px;border:2px solid var(--fl-c);background:var(--fl-l);color:var(--fl-c);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s">
      <span id="fl-icon">＋</span> Floridorlot
    </button>
  </div>

  <!-- ═══ CARTES GÎTES ═══ -->
  <div class="gites-grid" id="gites-grid">
    <div class="empty-state">Chargement…</div>
  </div>

  <!-- ═══ SECTION ASSIGNATION ═══ -->
  <div id="assignation-section" style="display:none">
    <div class="section-hdr">
      <div class="section-title">Vacanciers non assignés</div>
      <span class="section-badge" id="unassigned-count">0</span>
    </div>
    <div class="palette" id="palette-section">
      <div class="palette-lbl">Gîte actif — activez puis cliquez sur un vacancier</div>
      <div class="palette-btns">
        <button class="p-btn hu" id="gbtn-hulotte"     onclick="setActiveGite('hulotte')">Hulotte</button>
        <button class="p-btn si" id="gbtn-sixties"     onclick="setActiveGite('sixties')">Sixties</button>
        <button class="p-btn en" id="gbtn-envolee"     onclick="setActiveGite('envolee')">Envolée</button>
        <button class="p-btn fl" id="gbtn-floridorlot" onclick="setActiveGite('floridorlot')">Floridorlot</button>
        <button class="p-btn ar" id="gbtn-arces"       onclick="setActiveGite('arces')">Arces</button>
        <button class="p-btn none" id="gbtn-none"      onclick="setActiveGite('none')">✕ Effacer</button>
      </div>
    </div>
    <div class="active-bar" id="active-bar"></div>
    <div class="unassigned-grid" id="unassigned-grid"></div>
  </div>

  <!-- ═══ ARCHIVES ═══ -->
  <div class="archives-section">
    <div class="section-hdr">
      <div class="section-title">Archives</div>
      <span class="section-badge" id="archives-count">—</span>
    </div>
    <div class="archive-sel-card">
      <div class="archive-sel-lbl">Consulter un séjour archivé</div>
      <select class="archive-sel" id="archive-sejour-select" onchange="chargerArchives()">
        <option value="">— Sélectionner un séjour —</option>
      </select>
    </div>
    <div class="archive-grid" id="archives-grid"></div>
  </div>
</div>

<!-- ═══ MODALE IMPRESSION ═══ -->
<div class="mi-overlay" id="modal-impression" onclick="if(event.target===this)fermerModalImpression()">
  <div class="mi-box">
    <div class="mi-title">🖨️ Impression</div>
    <div class="mi-sub">Choisissez ce que vous souhaitez imprimer</div>

    <select class="mi-sel" id="modal-journee-select">
      <option value="">— Journée de transport —</option>
    </select>
    <button class="mi-btn mi-btn-green" onclick="imprimerFeuillesGites()">📋 Feuilles de départ par gîte</button>
    <button class="mi-btn mi-btn-green" onclick="imprimerFeuillesArrivee()">🏡 Feuilles d'arrivée par gîte</button>
    <button class="mi-btn mi-btn-outline" onclick="imprimerFiches()">🖨️ Fiches annotées conducteurs</button>
    <button class="mi-btn mi-btn-outline" onclick="imprimerAffichesVehicules()">🚐 Affiches véhicules</button>

    <button class="mi-close" onclick="fermerModalImpression()">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const SUPABASE_URL='https://lkqzifqeniblltniabai.supabase.co';

async function getJWT(){try{const{data:{session}}=await _supa.auth.getSession();if(session?.access_token)return session.access_token;}catch(e){}return SUPABASE_ANON;}
async function supa(path,method,body){const jwt=await getJWT();const h={apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'};if(method&&method!=='GET')h.Prefer='return=minimal';const opts={method:method||'GET',headers:h};if(body)opts.body=JSON.stringify(body);const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);if(!method||method==='GET'){const t=await r.text();return t?JSON.parse(t):[]; }return r.ok;}
async function supaUpsert(table,data){const jwt=await getJWT();return fetch(SUPABASE_URL+'/rest/v1/'+table,{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(data)});}

function ouvrirModalImpression(){
  // Repeupler le select à chaque ouverture (les _data sont perdus si DOM recréé)
  const sel=document.getElementById('modal-journee-select');
  if(sel && sel.options.length <= 1 && window._allJourneesData?.length){

      sel.appendChild(opt);
    });
    if(sel.options.length>1) sel.selectedIndex=1;
  }
  document.getElementById('modal-impression').classList.add('open');
}

function _imprimerFeuillesSejours(mode){
  let html='';
  GITE_ORDER.forEach(gite=>{
    const gc=GITE_STYLE[gite];
    const giteName=GITE_NAMES[gite];
    const gS=suiviData[gite]||{};
    const sejour=allSejours.find(s=>s.id===gS.sejour_id);
    if(!sejour) return;
    const pids=allVacancierGites.filter(vg=>vg.gite_id===gite&&vg.sejour_id===sejour.id).map(vg=>vg.personne_id);
    const vacanciers=allPersonnes.filter(p=>pids.includes(p.id));
    if(!vacanciers.length) return;
    vacanciers.sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')||(a.prenom||'').localeCompare(b.prenom||''));
    const n=vacanciers.length;
    const sz=n<=4?{name:36,pad:16}:n<=6?{name:30,pad:12}:n<=8?{name:26,pad:10}:n<=10?{name:22,pad:8}:{name:18,pad:6};
    const dateLabel=mode==='dep'?`Départ ${fmtDate(sejour.date_debut)}`:`Retour ${fmtDate(sejour.date_fin)}`;
    html+=`<div style="page-break-after:always;padding:16mm 16mm;font-family:Arial,Helvetica,sans-serif;background:white;height:265mm;box-sizing:border-box;display:flex;flex-direction:column">`;
    html+=`<div style="text-align:center;margin-bottom:10mm;flex-shrink:0"><div style="display:inline-block;background:${gc.bg};border:4pt solid ${gc.border};border-radius:14pt;padding:10pt 48pt"><div style="font-size:44pt;font-weight:900;color:${gc.color};letter-spacing:2pt;font-family:Georgia,serif">${giteName}</div></div><div style="font-size:14pt;color:#888;margin-top:4mm">${dateLabel}</div></div>`;
    html+=`<div style="flex:1;display:flex;flex-direction:column;justify-content:space-evenly">`;
    vacanciers.forEach((p,i)=>{html+=`<div style="background:${i%2===0?gc.bg:'white'};border-radius:8pt;padding:${sz.pad}pt 20pt;border:1pt solid #ddd;display:flex;align-items:center;gap:14pt"><span style="color:${gc.color};font-size:${sz.name*0.7}pt;font-weight:700;width:24pt;text-align:right;opacity:0.7">${i+1}</span><span style="font-size:${sz.name}pt;font-weight:800;color:#1a2e2c">${p.prenom} ${(p.nom||'').toUpperCase()}</span></div>`;});
    html+=`</div><div style="text-align:center;margin-top:4mm;font-size:10pt;color:#bbb">${n} vacancier${n>1?'s':''}</div></div>`;
  });
  if(!html){alert('Aucun vacancier assigné aux gîtes.');return;}
  if(typeof openPrintWindow!=='undefined') openPrintWindow(html,{title:mode==='dep'?'Feuilles départ':'Feuilles arrivée'});
  fermerModalImpression();
}

async function chargerGiteAssignments(){
  // Reconstruire depuis allVacancierGites (déjà en mémoire)
  // Double index : par personne_id ET par "Prénom NOM" normalisé
  giteAssignments={};
  allVacancierGites.forEach(vg=>{
    giteAssignments[vg.personne_id]=vg.gite_id;
    const p=allPersonnes.find(x=>x.id===vg.personne_id);
    if(p){
      giteAssignments[personKey(p)]=vg.gite_id;
      // Clé normalisée sans accents pour correspondance avec convois
      giteAssignments[normalizeKey(p)]=vg.gite_id;
    }
  });
}

function normalizeKey(p){
  return ((p.prenom||'')+' '+((p.nom||'').toUpperCase()))
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function personKey(p){return((p.prenom||'')+' '+((p.nom||'').toUpperCase())).trim();}
function initials(p,n){return((p||'')[0]||'')+((n||'')[0]||'');}
function fmtDateShort(d){if(!d)return'';try{return new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function fmtDateLong(d){if(!d)return'';try{return new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return d}}
function fmtDate(d){if(!d)return'';try{return new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function fmtH(mins){if(mins==null)return'';const h=Math.floor(mins/60)%24,m=mins%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function fmtDur(min){return Math.floor(min/60)+'h'+String(min%60).padStart(2,'0');}

function getAllPersonsInJournee(){
  // Legacy - now uses giteAssignments from vacancier_gites
  if(!getConvois().length)return[];
  const seen={},result=[];
  ((()=>{const _s=document.getElementById('modal-journee-select');return window._allJourneesData?.find(j=>j.id===_s?.value)?.data?.convois||[];})()||[]).forEach(c=>{
    [...(c.depart||[]),...(c.arrivee||[])].forEach(p=>{
      const key=personKey(p);
      if(!seen[key]){seen[key]=true;const found=allPersonnes.find(x=>x.prenom?.toLowerCase()===p.prenom?.toLowerCase()&&x.nom?.toUpperCase()===p.nom?.toUpperCase());result.push({...p,id:found?.id||null,foyer:found?.foyer||p.foyer||''});}
    });
  });
  result.sort((a,b)=>((a.nom||'').localeCompare(b.nom||''))||((a.prenom||'').localeCompare(b.prenom||'')));
  return result;
}

function getStatus(pid){
  if(!pid)return'empty';
  const f=allFiches.filter(x=>x.personne_id===pid),d=allDocuments.filter(x=>x.personne_id===pid);
  const hi=f.some(x=>x.mode_formulaire==='inscription'||x.mode_formulaire==='complet'),hc=f.some(x=>x.mode_formulaire==='confidentiel'||x.mode_formulaire==='complet');
  const di=d.some(x=>x.type==='inscription'||x.type==='dossier_complet'),dc=d.some(x=>x.type==='confidentiel'||x.type==='dossier_complet');
  if((hi||di)&&(hc||dc))return'complete';if(hi||hc||di||dc)return'partial';return'empty';
}
function getConvois(){

function renderUnassigned(){
  // Tous les vacanciers de la base non encore assignés à un gîte
  const assignedIds=new Set(allVacancierGites.map(vg=>vg.personne_id));
  const unassigned=allPersonnes.filter(p=>!assignedIds.has(p.id))
    .sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')||(a.prenom||'').localeCompare(b.prenom||''));
  document.getElementById('unassigned-count').textContent=unassigned.length;
  const grid=document.getElementById('unassigned-grid');
  if(!unassigned.length){grid.innerHTML='<div style="color:var(--green);font-size:13px;font-weight:600;padding:8px">✅ Tous les vacanciers sont assignés</div>';return;}

function setActiveGite(g){
  activeGite=g;
  GITES.forEach(gi=>{const btn=document.getElementById('gbtn-'+gi.id);if(btn){btn.style.opacity=gi.id===g?'1':'0.45';btn.style.transform=gi.id===g?'scale(1.05)':'';}});
  const nb=document.getElementById('gbtn-none');if(nb){nb.style.opacity=g==='none'?'1':'0.45';nb.style.transform=g==='none'?'scale(1.05)':'';}

async function assignGiteById(personId){
  const p=allPersonnes.find(x=>x.id===personId);
  if(!p) return;
  await assignGite(personKey(p));
}

async function assignGite(pKey){
  const newGite=activeGite==='none'?null:activeGite;
  if(newGite)giteAssignments[pKey]=newGite;else delete giteAssignments[pKey];
  const p=getAllPersonsInJournee().find(x=>personKey(x)===pKey);
  if(p?.id){
    const sejourId=newGite?(suiviData[newGite]?.sejour_id||null):null;
    if(newGite&&sejourId){await supaUpsert('vacancier_gites',{personne_id:p.id,sejour_id:sejourId,gite_id:newGite,updated_at:new Date().toISOString()});}
    else if(!newGite){const jwt=await getJWT();await fetch(SUPABASE_URL+'/rest/v1/vacancier_gites?personne_id=eq.'+p.id,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});}
  }
  renderGites();renderUnassigned();
}

async function assignSejour(giteId, sejourId){
  if(!suiviData[giteId]) suiviData[giteId]={sejour_id:null,animateurs:'',vehicules:[]};
  const oldSejourId = suiviData[giteId].sejour_id;
  // Archiver l'ancien séjour si il y en avait un et qu'il change
  if(oldSejourId && oldSejourId !== sejourId){
    await archiverGite(giteId, oldSejourId);
    // Réinitialiser les véhicules (comme les animateurs et vacanciers)
    suiviData[giteId].vehicules = [];
  }
  suiviData[giteId].sejour_id = sejourId||null;
  await saveGite(giteId);
  renderGites();
}

async function archiverGite(giteId, sejourId){
  const sejour = allSejours.find(s=>s.id===sejourId);
  if(!sejour) return;
  const gS = suiviData[giteId]||{};
  // Récupérer les vacanciers assignés à ce gîte/séjour
  const rows = await supa('vacancier_gites?gite_id=eq.'+giteId+'&sejour_id=eq.'+sejourId+'&select=personne_id');
  const vacanciers = (rows||[]).map(r=>{
    const p = allPersonnes.find(x=>x.id===r.personne_id);
    return p ? {prenom:p.prenom, nom:p.nom, foyer:p.foyer} : null;
  }).filter(Boolean);
  await supaUpsert('suivi_archives', {
    gite_id: giteId,
    sejour_id: sejourId,
    sejour_nom: sejour.nom,
    date_debut: sejour.date_debut,
    date_fin: sejour.date_fin,
    animateurs: gS.animateurs||'',
    vehicules: gS.vehicules||[],
    vacanciers: vacanciers,
    archived_at: new Date().toISOString()
  });
}

async function addVehicle(giteId){const sel=document.getElementById('veh-'+giteId);if(!sel?.value)return;const veh=allVehicules.find(v=>v.id===sel.value);if(!veh)return;if(!suiviData[giteId])suiviData[giteId]={sejour_id:null,animateurs:'',vehicules:[]};suiviData[giteId].vehicules.push({id:veh.id,label:veh.label,ico:veh.ico||'🚐'});await saveGite(giteId);renderGites();}
async function removeVehicle(giteId,vehicleId){if(!suiviData[giteId])return;suiviData[giteId].vehicules=(suiviData[giteId].vehicules||[]).filter(v=>v.id!==vehicleId);await saveGite(giteId);renderGites();}
async function saveGite(giteId,override){
  const d=override||suiviData[giteId]||{};const jwt=await getJWT();
  const res=await fetch(SUPABASE_URL+'/rest/v1/suivi_gites?gite_id=eq.'+giteId,{method:'PATCH',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=minimal,count=exact'},body:JSON.stringify({sejour_id:d.sejour_id||null,animateurs:d.animateurs||'',vehicules:d.vehicules||[],updated_at:new Date().toISOString()})});
  if(res.headers.get('content-range')==='*/0'){await fetch(SUPABASE_URL+'/rest/v1/suivi_gites',{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({gite_id:giteId,sejour_id:d.sejour_id||null,animateurs:d.animateurs||'',vehicules:d.vehicules||[],updated_at:new Date().toISOString()})});}
}

// ── AJOUT MANUEL (vacancier sans convoi) ─────────────────────────
function filterManualSearch(giteId, query){
  const drop = document.getElementById('manual-drop-'+giteId);
  if(!drop) return;
  const q = (query||'').toLowerCase().trim();
  // Exclure les vacanciers déjà assignés (par personne_id)
  const assignedIds = new Set(allVacancierGites.map(vg=>vg.personne_id));
  const candidates = allPersonnes.filter(p=>{
    if(assignedIds.has(p.id)) return false;
    return !q || `${p.prenom} ${p.nom} ${p.foyer||''}`.toLowerCase().includes(q);
  }).slice(0, 10);
  if(!allPersonnes.length){
    drop.innerHTML='<div style="padding:10px 14px;font-size:12px;color:var(--light)">Aucun vacancier en base</div>';
    drop.style.display='block'; return;
  }
  if(!candidates.length){
    drop.innerHTML='<div style="padding:10px 14px;font-size:12px;color:var(--light)">Aucun résultat</div>';
    drop.style.display='block'; return;
  }
  drop.innerHTML = candidates.map(p=>`
    <div onmousedown="assignManuel('${giteId}','${p.id}','${personKey(p).replace(/'/g,"\\'")}')"
      style="padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f3f4f6;font-size:13px"
      onmouseover="this.style.background='#f0faf8'" onmouseout="this.style.background='white'">
      <strong>${p.prenom} ${(p.nom||'').toUpperCase()}</strong>
      <span style="font-size:11px;color:var(--light)">${p.foyer||''}</span>
    </div>`).join('');
  drop.style.display='block';
}

function hideManualDrop(giteId){
  const drop = document.getElementById('manual-drop-'+giteId);
  if(drop) drop.style.display='none';
}

async function assignManuel(giteId, personId, pKey){
  hideManualDrop(giteId);
  const inp = document.getElementById('manual-search-'+giteId);
  if(inp) inp.value='';
  // Assigner ce vacancier au gîte
  giteAssignments[pKey] = giteId;
  const sejourId = suiviData[giteId]?.sejour_id||null;
  if(sejourId){
    await supaUpsert('vacancier_gites',{personne_id:personId,sejour_id:sejourId,gite_id:giteId,updated_at:new Date().toISOString()});
  }
  renderGites();
  renderUnassigned();
}

    var totalLines = convoisAvecGite.reduce(function(s,i){ return s + 1 + i.vacanciers.length + 1; }, 0) + 1; // +1 titre

    var inner = '';

      inner += '<div style="margin-bottom:10px;border:1.5px solid #ddd;border-radius:8px;overflow:hidden">';
      inner += '<div style="background:#f5f5f5;border:1.5px solid #ccc;border-bottom:2.5px solid '+gc.border+';padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">'
        + '<span style="color:#1a2e2c;font-size:16px;font-weight:900;letter-spacing:0.5px">🚐 '+vehicule+'</span>'

function imprimerFeuillesArrivee(){
  const _mSelA=document.getElementById('modal-journee-select');
  const _journeeA=window._allJourneesData?.find(j=>j.id===_mSelA?.value)?.data;
  if(!_journeeA||!_journeeA.convois?.length){alert('Sélectionnez une journée de transport dans la modale.');return;}
  fermerModalImpression();

  var GITE_NAMES = { hulotte:'Hulotte', sixties:'Sixties', envolee:'Envolée', floridorlot:'Floridorlot', arces:'Arces' };
  var GITE_STYLE = {
    hulotte:     { color:'#2e7d32', bg:'#e8f5e9', border:'#2e7d32' },
    sixties:     { color:'#ad1457', bg:'#fce4ec', border:'#ad1457' },
    envolee:     { color:'#e65100', bg:'#fff8e1', border:'#f57f17' },
    floridorlot: { color:'#6a1b9a', bg:'#f3e5f5', border:'#6a1b9a' },
    arces:       { color:'#1565c0', bg:'#e3f2fd', border:'#1565c0' },
  };

  // Tailles selon nombre de vacanciers (max 12, lisible de loin)
  // A4 dispo ~237mm après marges 16mm top+bottom+30mm titre
  function sizes(n) {
    // nameSize en pt, paddingV en pt
    if (n <= 4)  return { name: 36, pad: 16 };
    if (n <= 6)  return { name: 30, pad: 12 };
    if (n <= 8)  return { name: 26, pad: 10 };
    if (n <= 10) return { name: 22, pad:  8 };
    return            { name: 18, pad:  6 };
  }

  var html = '';

  ['hulotte','sixties','envolee','floridorlot','arces'].forEach(function(gite) {
    var gc = GITE_STYLE[gite];
    var giteName = GITE_NAMES[gite];

    var seen = {}, vacanciers = [];
    (()=>{const _s=document.getElementById('modal-journee-select');return window._allJourneesData?.find(j=>j.id===_s?.value)?.data?.convois||[];})().forEach(function(c) {
      (c.arrivee||[]).forEach(function(p) {
        var key = (p.prenom||'')+' '+((p.nom||'').toUpperCase());
        var keyNorm=key.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if ((giteAssignments[key]===gite||giteAssignments[keyNorm]===gite) && !seen[key]) {
          seen[key] = true;
          vacanciers.push({ prenom: p.prenom, nom: (p.nom||'').toUpperCase() });
        }
      });
    });

    if (!vacanciers.length) return;
    vacanciers.sort(function(a,b){ return a.nom.localeCompare(b.nom)||a.prenom.localeCompare(b.prenom); });

    var n = vacanciers.length;
    var sz = sizes(n);

    html += '<div style="page-break-after:always;page-break-inside:avoid;'
      + 'padding:16mm 16mm;font-family:Arial,Helvetica,sans-serif;background:white;'
      + 'height:265mm;box-sizing:border-box;display:flex;flex-direction:column;">';

    // Titre grand et centré
    html += '<div style="text-align:center;margin-bottom:10mm;flex-shrink:0">'
      + '<div style="display:inline-block;background:'+gc.bg+';border:4pt solid '+gc.border+';border-radius:14pt;padding:10pt 48pt">'
      + '<div style="font-size:44pt;font-weight:900;color:'+gc.color+';letter-spacing:2pt;font-family:Georgia,serif">'+giteName+'</div>'
      + '</div></div>';

    // Liste — flex:1, espace réparti uniformément
    html += '<div style="flex:1;display:flex;flex-direction:column;justify-content:space-evenly">';
    vacanciers.forEach(function(p, i) {
      html += '<div style="background:'+(i%2===0?gc.bg:'white')+';border-radius:8pt;'
        + 'padding:'+sz.pad+'pt 20pt;border:1pt solid #ddd;'
        + 'display:flex;align-items:center;gap:14pt">'
        + '<span style="color:'+gc.color+';font-size:'+(sz.name*0.7)+'pt;font-weight:700;width:24pt;text-align:right;flex-shrink:0;opacity:0.7">'+(i+1)+'</span>'
        + '<span style="font-size:'+sz.name+'pt;font-weight:800;color:#1a2e2c;letter-spacing:0.5pt">'+p.prenom+' '+p.nom+'</span>'
        + '</div>';
    });
    html += '</div>';

    // Total discret
    html += '<div style="text-align:center;margin-top:4mm;flex-shrink:0;font-size:10pt;color:#bbb">'
      + n + ' vacancier'+(n>1?'s':'')+' attendu'+(n>1?'s':'')+'</div>';

    html += '</div>';
  });

  if (!html) return;
  if (typeof openPrintWindow !== 'undefined') {
    openPrintWindow(html, { title:'Feuilles arrivée par gîte' });
  }
}

      + '<div style="font-size:13px;line-height:2.2">'
      + c.depart.map(function(p){return renderPerson(p, true, true);}).join('<br>')
      + (c.depart.length&&c.arrivee.length?'<br>':'')
      + c.arrivee.map(function(p){return renderPerson(p, false, true);}).join('<br>')
      + '</div></div>'
      + '<div style="background:#f8f8f8;border:1px solid #ddd;border-radius:10px;padding:14px"><div style="font-size:10px;font-weight:700;color:#18534F;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Trajet</div>'
      + '<div style="font-size:13px;line-height:2.2">'
      + 'Distance : <strong>~'+c.km+' km</strong><br>'
      + 'Durée : <strong style="color:'+durC+'">~'+fmtDur(c.dureeMin)+'</strong><br>'
      + 'Pic : <strong>'+c.peakSeats+'/'+c.vehicule.cap+'</strong>'
      + (c.conducteur?'<br>Conducteur : <strong>'+c.conducteur+'</strong>':'')
      + (c.notes?'<br>Notes : <em>'+(c.notes||'')+'</em>':'')
      + '</div></div></div>';

    // Timeline arrêts — si split : tous les stops page 1, QR page 2
    // Si pas split : tout sur une page
    var stopsHeaderHtml = '<div style="background:white;border:1.5px solid #e5e0d6;padding:16px;border-radius:10px">'
      + '<div style="font-size:11px;font-weight:700;color:#18534F;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Ordre des arrêts</div>';

    var stopsBodyHtml = '';
    c.stops.forEach(function(s, si) {
      var dotC = s.action==='depart'||s.action==='retour'?'#18534F':s.action==='pickup'?'#1a7a4a':'#C0392B';
      var heureStr = (si===0||si===c.stops.length-1)&&heures[si]!==undefined
        ? ' <span style="background:#EEF7F5;color:#18534F;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">'+fmtH(heures[si])+'</span>' : '';
      var phaseHtml='', pLine='', sn=s.seats||0;

      if(s.action==='depart'){
        phaseHtml='<span style="background:#D5F0EC;color:#18534F;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">Phase aller</span>';
        pLine='<strong>'+sn+' à bord</strong>';
      } else if(s.action==='depot'){
        pLine='<strong style="color:#C0392B">Dép.</strong> : '+(s.depPers||[]).map(function(p){return renderPerson(p,true,false);}).join(', ')+' <strong>['+sn+'/'+c.vehicule.cap+']</strong>';
      } else if(s.action==='rotation'){
        pLine='<strong style="color:#C0392B">Dép</strong>: '+(s.depPers||[]).map(function(p){return renderPerson(p,true,false);}).join(', ')
          +' / <strong style="color:#1a7a4a">Arr</strong>: '+(s.arrPers||[]).map(function(p){return renderPerson(p,false,false);}).join(', ')
          +' <strong>['+sn+'/'+c.vehicule.cap+']</strong>';
      } else if(s.action==='pickup'){
        phaseHtml='<span style="background:#EAFAF1;color:#1a7a4a;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px">Phase retour</span>';
        pLine='<strong style="color:#1a7a4a">Arr.</strong> : '+(s.arrPers||[]).map(function(p){return renderPerson(p,false,false);}).join(', ')+' <strong>['+sn+'/'+c.vehicule.cap+']</strong>';
      } else if(s.action==='retour'){
        pLine='<strong>'+sn+' à l\'arrivée</strong>';
      }

      var timeDetail = renderTimeDetail(si, rawArr, heures, pqIdx);

      var stopHtml = '<div style="display:flex;gap:0;position:relative;margin-bottom:4px">'
        + '<div style="width:2px;background:#E5E0D6;margin-left:19px;margin-right:0;'+(si===c.stops.length-1?'opacity:0':'')+'"></div>'
        + '<div style="display:flex;gap:12px;padding:6px 0 6px 0;flex:1">'
        + '<div style="width:38px;height:38px;border-radius:50%;background:'+dotC+';display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px;flex-shrink:0;margin-left:0">'+(si+1)+'</div>'
        + '<div style="flex:1;padding-top:2px">'
        + (phaseHtml?'<div style="margin-bottom:2px">'+phaseHtml+'</div>':'')
        + '<div style="font-size:14px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px">'+s.pt.nom+heureStr+timeDetail+'</div>'
        + (s.pt.adresse&&s.action!=='depart'&&s.action!=='retour'?'<div style="font-size:11px;color:#5C6B6A">'+s.pt.adresse+'</div>':'')
        + '<div style="font-size:12px;color:#5C6B6A">'+pLine+'</div>'
        + '</div></div></div>';

      stopHtml += (si === pqIdx ? PIQUENIQUE_HTML : '');
      stopsBodyHtml += stopHtml;
    });

    // QR
    var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=' + encodeURIComponent(mapsUrl);
    var qrHtml = '<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 14px;background:#EBF5FB;border-radius:10px;border:1px solid #b8ddf0;margin-top:12px">'
      + '<img src="' + qrUrl + '" style="width:80px;height:80px;flex-shrink:0;border:1px solid #ddd">'
      + '<div><div style="font-size:11px;font-weight:700;color:#0077A8;margin-bottom:3px">Itinéraire Google Maps</div>'
      + '<div style="font-size:8px;color:#0077A8;word-break:break-all">'+mapsUrl+'</div>'
      + '<a href="'+mapsUrl+'" target="_blank" style="display:inline-block;margin-top:5px;background:#0077A8;color:white;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;text-decoration:none">Ouvrir Maps</a>'
      + '</div></div>';

    if (!splitMode) {
      // Tout sur une page
      html += stopsHeaderHtml + stopsBodyHtml + '</div>' + qrHtml + '</div>';
    } else {
      // PAGE 1 : header + passagers + stops
      html += stopsHeaderHtml + stopsBodyHtml + '</div></div>';

      // PAGE 2 : header allégé (rappel) + QR
      html += '<div style="border:1.5px solid #b0c4c2;border-radius:14px;padding:20px;background:white;page-break-inside:avoid;page-break-after:always">';
      // Rappel convoi
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1.5px solid #b0c4c2">'
        + '<div style="width:32px;height:32px;border-radius:50%;background:'+clr+';display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px">'+(i+1)+'</div>'
        + '<div style="font-size:14px;font-weight:700;color:#18534F">Convoi '+(i+1)+' — '+c.vehicule.label+(c.conducteur?' — '+c.conducteur:'')+' <span style="font-size:11px;color:#999;font-weight:400">· suite</span></div>'
        + '<span style="margin-left:auto;background:#EEF7F5;color:#18534F;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600">2/2</span>'
        + '</div>';
      html += qrHtml + '</div>';
    }
  return html;
}

// ── ARCHIVES ─────────────────────────────────────────────────────
async function chargerArchives(){
  const sel = document.getElementById('archive-sejour-select');
  const sejourId = sel.value;
  const grid = document.getElementById('archives-grid');
  const count = document.getElementById('archives-count');
  if(!sejourId){ grid.innerHTML=''; count.textContent='—'; return; }
  grid.innerHTML='<div style="color:var(--light);font-size:13px;padding:16px">Chargement…</div>';
  const rows = await supa('suivi_archives?sejour_id=eq.'+sejourId+'&select=*&order=gite_id.asc');
  if(!rows||!rows.length){ grid.innerHTML='<div style="color:var(--light);font-size:13px;padding:16px">Aucune archive pour ce séjour.</div>'; count.textContent='0'; return; }
  count.textContent=rows.length+' gîte'+(rows.length>1?'s':'');
  const gc={hulotte:{c:'#2e7d32',bg:'#e8f5e9',b:'#a5d6a7'},sixties:{c:'#ad1457',bg:'#fce4ec',b:'#f48fb1'},envolee:{c:'#e65100',bg:'#fff8e1',b:'#ffcc80'},floridorlot:{c:'#6a1b9a',bg:'#f3e5f5',b:'#ce93d8'},arces:{c:'#1565c0',bg:'#e3f2fd',b:'#90caf9'}};
  const GITE_LABELS={hulotte:'Hulotte',sixties:'Sixties',envolee:'Envolée',floridorlot:'Floridorlot',arces:'Arces'};
  grid.innerHTML = rows.map(r=>{
    const g=gc[r.gite_id]||{c:'#666',bg:'#f5f5f5',b:'#ddd'};
    const vacs=(r.vacanciers||[]);
    const vehs=(r.vehicules||[]);
    const archDate=new Date(r.archived_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div style="background:white;border-radius:12px;border:1px solid var(--border-l);overflow:hidden;box-shadow:0 2px 8px rgba(24,83,79,0.07)">
      <div style="background:${g.bg};border-bottom:2px solid ${g.b};padding:11px 14px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:${g.c}">${GITE_LABELS[r.gite_id]||r.gite_id}</span>
        <span style="font-size:10px;color:${g.c};opacity:0.7">${archDate}</span>
      </div>
      <div style="padding:10px 14px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:12px"><span style="font-weight:700;color:var(--text-mid)">Séjour : </span>${r.sejour_nom||'—'}</div>
        <div style="font-size:12px"><span style="font-weight:700;color:var(--text-mid)">Dates : </span>${r.date_debut?fmtDate(r.date_debut)+' → '+fmtDate(r.date_fin):'—'}</div>
        ${r.animateurs?`<div style="font-size:12px"><span style="font-weight:700;color:var(--text-mid)">Animateurs : </span>${r.animateurs}</div>`:''}
        ${vehs.length?`<div style="font-size:12px"><span style="font-weight:700;color:var(--text-mid)">Véhicules : </span>${vehs.map(v=>v.label).join(', ')}</div>`:''}
        <div style="border-top:1px solid var(--border-l);padding-top:8px">
          <div style="font-size:10px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px">Vacanciers (${vacs.length})</div>
          ${vacs.map(v=>`<div style="font-size:12px;padding:3px 0;color:var(--text)">${v.prenom} ${(v.nom||'').toUpperCase()}${v.foyer?` <span style="color:var(--light);font-size:10px">(${v.foyer})</span>`:''}</div>`).join('')||'<div style="font-size:12px;color:var(--light)">Aucun vacancier enregistré</div>'}
        </div>
      </div>
    </div></div></div>`;
  }).join('');
}

async function retirerVacancierById(personId, giteId, sejourId){
  if(!confirm('Retirer ce vacancier du gîte ?')) return;
  const jwt=await getJWT();
  let url=SUPABASE_URL+'/rest/v1/vacancier_gites?personne_id=eq.'+personId;
  if(sejourId) url+='&sejour_id=eq.'+sejourId;
  await fetch(url,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});
  // Mettre à jour localement
  allVacancierGites=allVacancierGites.filter(vg=>!(vg.personne_id===personId&&(!sejourId||vg.sejour_id===sejourId)));
  delete giteAssignments[allPersonnes.find(p=>p.id===personId)?.nom||personId];
  renderGites();
  renderUnassigned();
}

async function retirerVacancier(pKey){
  if(!confirm('Retirer ce vacancier du gîte ?')) return;
  delete giteAssignments[pKey];
  // Supprimer en base
  const p = getAllPersonsInJournee().find(x=>personKey(x)===pKey);
  if(p?.id){
    const sejourId = Object.values(suiviData).find(s=>s.sejour_id)?.sejour_id||null;
    const jwt=await getJWT();
    // Chercher la ligne exacte
    await fetch(SUPABASE_URL+'/rest/v1/vacancier_gites?personne_id=eq.'+p.id,{
      method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}
    });
  }
  renderGites();
  renderUnassigned();
}

// ── ANIMATEURS — BULLES ──────────────────────────────────────────
function getAnimateurBubbles(giteId, sejourId){
  if(!sejourId) return '<span style="font-size:11px;color:var(--light)">Choisissez un séjour d\'abord</span>';
  const animsForGite = giteAnimateurs.filter(ga=>ga.gite_id===giteId&&ga.sejour_id===sejourId);
  if(!animsForGite.length) return '<span style="font-size:11px;color:var(--light)">Aucun animateur</span>';
  return animsForGite.map(ga=>{
    const anim = allAnimateurs.find(a=>a.id===ga.animateur_id);
    if(!anim) return '';
    const nom = (anim.prenom||'')+' '+(anim.nom||'').toUpperCase();
    return `<span onclick="window.location.href='animateur.html?id=${anim.id}'"
      style="display:inline-flex;align-items:center;gap:5px;background:#eef7f5;border:1.5px solid var(--border-l);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--f);cursor:pointer;transition:all 0.15s"
      onmouseover="this.style.background='var(--border-l)'" onmouseout="this.style.background='#eef7f5'">
      👤 ${nom}
      <button onmousedown="event.stopPropagation();removeAnimateur('${ga.id}','${giteId}','${sejourId}')"
        style="background:none;border:none;cursor:pointer;color:var(--light);font-size:12px;padding:0;line-height:1;display:flex;align-items:center">✕</button>
    </span>`;
  }).join('');
}

function filterAnimSearch(giteId, query){
  const drop = document.getElementById('anim-drop-'+giteId);
  if(!drop) return;
  const gS = suiviData[giteId]||{};
  const sejourId = gS.sejour_id||null;
  const q = (query||'').toLowerCase().trim();
  // Exclure déjà assignés à ce gîte+séjour
  const assigned = new Set(giteAnimateurs.filter(ga=>ga.gite_id===giteId&&ga.sejour_id===sejourId).map(ga=>ga.animateur_id));
  const candidates = allAnimateurs.filter(a=>{
    if(assigned.has(a.id)) return false;
    return !q || `${a.prenom} ${a.nom}`.toLowerCase().includes(q);
  }).slice(0,8);

  // Ajouter option "Créer nouveau"
  const createOpt = q ? `<div onmousedown="creerEtAssignerAnimateur('${giteId}','${sejourId}','${q.replace(/'/g, "\\'")}')"
    style="padding:8px 14px;cursor:pointer;font-size:12px;color:var(--f);font-weight:700;border-top:1px solid var(--border-l);display:flex;align-items:center;gap:6px"
    onmouseover="this.style.background='#f0faf8'" onmouseout="this.style.background='white'">
    ➕ Créer "${query}"
  </div>` : '';

  if(!candidates.length && !q){ drop.style.display='none'; return; }

  drop.innerHTML = candidates.map(a=>`
    <div onmousedown="assignerAnimateur('${giteId}','${sejourId}','${a.id}')"
      style="padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f3f4f6;font-size:13px"
      onmouseover="this.style.background='#f0faf8'" onmouseout="this.style.background='white'">
      <strong>${a.prenom} ${(a.nom||'').toUpperCase()}</strong>
      <span style="font-size:10px;color:var(--light)">${a.email||''}</span>
    </div>`).join('')+createOpt;
  drop.style.display='block';
}

function toggleAnimSearch(giteId){
  const wrap=document.getElementById('anim-search-wrap-'+giteId);
  if(!wrap) return;
  const isHidden=wrap.style.display==='none';
  wrap.style.display=isHidden?'block':'none';
  if(isHidden){
    const inp=document.getElementById('anim-search-'+giteId);
    if(inp){inp.value='';inp.focus();filterAnimSearch(giteId,'');}
  }
}

function hideAnimDrop(giteId){
  const d=document.getElementById('anim-drop-'+giteId);
  if(d) d.style.display='none';
  const inp=document.getElementById('anim-search-'+giteId);
  if(inp) inp.value='';
}

async function assignerAnimateur(giteId, sejourId, animId){
  hideAnimDrop(giteId);
  if(!sejourId){alert('Sélectionnez un séjour pour ce gîte d\'abord.');return;}
  const jwt=await getJWT();
  const r=await fetch(SUPABASE_URL+'/rest/v1/gite_animateurs',{
    method:'POST',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify({animateur_id:animId,gite_id:giteId,sejour_id:sejourId})
  });
  const data=await r.json();
  if(data&&data[0]) giteAnimateurs.push(data[0]);
  renderGites();
}

async function creerEtAssignerAnimateur(giteId, sejourId, nom){
  hideAnimDrop(giteId);
  if(!sejourId){alert('Sélectionnez un séjour pour ce gîte d\'abord.');return;}
  // Parser prénom nom
  const parts = nom.trim().split(' ');
  const prenom = parts[0]||'';
  const nomF = parts.slice(1).join(' ').toUpperCase()||'';
  const jwt=await getJWT();
  // Créer l'animateur
  const rAnim=await fetch(SUPABASE_URL+'/rest/v1/animateurs',{
    method:'POST',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({prenom,nom:nomF,email:'',telephone:'',notes:''})
  });
  const animData=await rAnim.json();
  const newAnim=animData&&animData[0];
  if(!newAnim){alert('Erreur lors de la création.');return;}
  allAnimateurs.push(newAnim);
  await assignerAnimateur(giteId, sejourId, newAnim.id);
}

async function removeAnimateur(gaId, giteId, sejourId){
  const jwt=await getJWT();
  await fetch(SUPABASE_URL+'/rest/v1/gite_animateurs?id=eq.'+gaId,{
    method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}
  });
  giteAnimateurs=giteAnimateurs.filter(ga=>ga.id!==gaId);
  renderGites();
}

init();
