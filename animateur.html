<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animateurs — La Lysardière</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --forest:#18534F; --forest-mid:#226D68; --forest-light:#2d8a7f;
  --gold:#D4AF6A; --gold-deep:#B8943A; --gold-pale:#FBF5E6;
  --mint:#EEF7F5; --mint-deep:#C8EAE4; --mint-mid:#A8D8D0;
  --bg:#F7F4EE; --card:#FFFFFF; --card2:#FAFAF8;
  --text:#1a2e2c; --text-mid:#4a6260; --text-light:#8FA5A3;
  --border:#E2DDD4; --border-light:#EDE9E0;
  --red:#c0392b; --red-bg:#fdf1f0; --red-mid:#e8877f;
  --green:#1a7a4a; --green-bg:#edfbf2;
  --orange:#d35400; --orange-bg:#fef5ec;
  --shadow-sm:0 1px 4px rgba(24,83,79,0.07);
  --shadow:0 3px 14px rgba(24,83,79,0.10);
  --shadow-md:0 8px 32px rgba(24,83,79,0.14);
  --radius:16px; --radius-sm:10px; --radius-xs:7px;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ── HEADER ── */
.header {
  background:linear-gradient(135deg,var(--forest) 0%,var(--forest-mid) 100%);
  height:56px; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; position:sticky; top:0; z-index:200;
  box-shadow:0 2px 20px rgba(0,0,0,0.18);
}
.header-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
.header-brand img { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); }
.hd-title { font-family:'Fraunces',serif; font-size:15px; color:var(--gold); letter-spacing:0.2px; }
.hd-sub { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:2.5px; text-transform:uppercase; margin-top:1px; }
.header-right { display:flex; align-items:center; gap:8px; }
.hdr-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 14px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:600; font-family:inherit; text-decoration:none; white-space:nowrap; transition:all 0.15s; }
.hdr-ghost { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.8); }
.hdr-ghost:hover { background:rgba(255,255,255,0.2); color:white; }
.hdr-gold { background:var(--gold); color:var(--forest); }
.hdr-gold:hover { background:var(--gold-deep); }

/* ── MAIN ── */
.main { max-width:860px; margin:0 auto; padding:28px 20px 100px; }

/* ── LISTE MODE ── */
.liste-search-bar {
  background:var(--card); border-radius:var(--radius); padding:18px 22px;
  margin-bottom:16px; box-shadow:var(--shadow); border:1px solid var(--border-light);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.search-input {
  flex:1; min-width:200px; padding:10px 16px;
  border:1.5px solid var(--border); border-radius:9px;
  font-size:14px; font-family:inherit; color:var(--text); background:var(--bg);
  outline:none; transition:border-color 0.2s;
}
.search-input:focus { border-color:var(--forest-mid); background:white; }
.btn-create {
  padding:10px 20px; background:var(--forest); color:white;
  border:none; border-radius:9px; font-size:13px; font-weight:700;
  font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:all 0.15s; white-space:nowrap;
}
.btn-create:hover { background:var(--forest-mid); }

.form-creation {
  display:none; background:var(--card); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow-md);
  border-top:3px solid var(--forest);
}
.form-title { font-family:'Fraunces',serif; font-size:16px; color:var(--forest); margin-bottom:16px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.field-group label { display:block; font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:4px; }
.field-input { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:13px; font-family:inherit; color:var(--text); background:var(--bg); outline:none; transition:border-color 0.2s; }
.field-input:focus { border-color:var(--forest-mid); background:white; }
.form-actions { display:flex; gap:8px; }
.btn-sm { padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s; border:1.5px solid; display:inline-flex; align-items:center; gap:4px; }
.btn-primary { background:var(--forest); color:white; border-color:var(--forest); }
.btn-primary:hover { background:var(--forest-mid); }
.btn-ghost-sm { background:transparent; color:var(--text-mid); border-color:var(--border); }
.btn-ghost-sm:hover { background:var(--mint); border-color:var(--mint-deep); }
.btn-danger-sm { background:var(--red-bg); color:var(--red); border-color:var(--red-mid); }
.btn-danger-sm:hover { background:#f9dbd9; }

/* Animateur row */
.anim-row {
  background:var(--card); border-radius:var(--radius-sm); border:1px solid var(--border-light);
  padding:14px 18px; margin-bottom:8px; display:flex; align-items:center; gap:14px;
  cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow-sm);
}
.anim-row:hover { background:var(--mint); border-color:var(--mint-deep); transform:translateY(-1px); box-shadow:var(--shadow); }
.anim-avatar {
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--forest),var(--forest-mid));
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700; color:white;
}
.anim-name { font-weight:700; font-size:14px; color:var(--text); }
.anim-meta { font-size:12px; color:var(--text-mid); margin-top:2px; }
.anim-arrow { color:var(--text-light); font-size:14px; margin-left:auto; }
.empty { text-align:center; padding:40px 20px; color:var(--text-light); font-size:14px; }

/* ── FICHE MODE ── */
/* Bannière profil */
.profile-banner {
  background:linear-gradient(135deg,var(--forest) 0%,var(--forest-mid) 55%,#2d8a7f 100%);
  border-radius:var(--radius); padding:28px 28px 24px; margin-bottom:20px;
  box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}
.profile-banner::before {
  content:''; position:absolute; top:-40px; right:-40px;
  width:200px; height:200px; border-radius:50%;
  background:rgba(212,175,106,0.12); pointer-events:none;
}
.profile-banner::after {
  content:''; position:absolute; bottom:-60px; left:40%;
  width:160px; height:160px; border-radius:50%;
  background:rgba(255,255,255,0.05); pointer-events:none;
}
.profile-top { display:flex; align-items:flex-start; gap:18px; margin-bottom:20px; }
.profile-avatar {
  width:68px; height:68px; border-radius:50%; flex-shrink:0;
  background:rgba(255,255,255,0.15); border:2.5px solid rgba(212,175,106,0.6);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:700; color:var(--gold); font-family:'Fraunces',serif;
}
.profile-title { flex:1; }
.profile-name { font-family:'Fraunces',serif; font-size:26px; color:white; font-weight:700; line-height:1.1; }
.profile-subtitle { font-size:12px; color:rgba(255,255,255,0.5); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px; }
.profile-fields {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.profile-field {
  background:rgba(255,255,255,0.08); border-radius:var(--radius-xs);
  padding:10px 14px; border:1px solid rgba(255,255,255,0.1);
}
.profile-field label { display:block; font-size:9px; font-weight:700; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.profile-field input { background:transparent; border:none; outline:none; font-family:inherit; font-size:13px; color:white; width:100%; font-weight:500; }
.profile-field input::placeholder { color:rgba(255,255,255,0.3); }
.profile-field.full { grid-column:1/-1; }

/* Boutons mail */
.mail-bar {
  margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12);
  display:none; flex-wrap:wrap; gap:8px;
}
.mail-btn {
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
  background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.9);
  border:1px solid rgba(255,255,255,0.2); border-radius:8px;
  font-size:12px; font-weight:600; font-family:inherit; cursor:pointer;
  text-decoration:none; transition:all 0.15s;
}
.mail-btn:hover { background:rgba(255,255,255,0.22); color:white; }

/* ── SECTIONS ── */
.section {
  background:var(--card); border-radius:var(--radius); margin-bottom:14px;
  box-shadow:var(--shadow-sm); border:1px solid var(--border-light); overflow:hidden;
}
.section-head {
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border-light); background:var(--card2);
}
.section-head-title { font-family:'Fraunces',serif; font-size:14px; font-weight:700; color:var(--forest); display:flex; align-items:center; gap:8px; }
.count-badge { background:var(--mint); border:1px solid var(--mint-deep); border-radius:20px; padding:1px 9px; font-size:11px; font-family:'DM Sans',sans-serif; font-weight:700; color:var(--forest); }
.section-body { padding:14px 20px; }

/* Upload bar */
.upload-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.select-input { padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; color:var(--text); background:var(--bg); outline:none; }
.select-input:focus { border-color:var(--forest-mid); }
.upload-label { cursor:pointer; }
.upload-label input { display:none; }
.upload-status { font-size:12px; color:var(--text-mid); }

/* Doc rows */
.doc-type-group { margin-bottom:12px; }
.doc-type-label-row {
  font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;
  letter-spacing:0.9px; margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.doc-type-label-row::after { content:''; flex:1; height:1px; background:var(--border-light); }
.doc-item {
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  background:var(--card2); border-radius:var(--radius-xs); border:1px solid var(--border-light);
  margin-bottom:5px;
}
.doc-name { font-size:13px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-date { font-size:11px; color:var(--text-light); white-space:nowrap; margin-right:4px; }
.type-pill { display:inline-block; padding:2px 8px; border-radius:5px; font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; }
.type-cv{background:#dbeafe;color:#1d4ed8} .type-cni{background:#d1fae5;color:#065f46}
.type-casier{background:#fef9c3;color:#854d0e} .type-rib{background:#fce7f3;color:#9d174d}
.type-contrat{background:#fef3c7;color:#92400e} .type-divers{background:#f3f4f6;color:#374151}

/* Vierges */
.vierge-item {
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  border:1px solid var(--border-light); border-radius:var(--radius-xs);
  background:var(--card2); margin-bottom:6px;
}
.vierge-icon { font-size:22px; flex-shrink:0; }
.vierge-label { font-size:13px; font-weight:600; flex:1; }

/* Boutons */
.btn-icon { background:var(--mint); border:1px solid var(--mint-deep); color:var(--forest); padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s; }
.btn-icon:hover { background:var(--mint-deep); }
.btn-del { background:var(--red-bg); border:1px solid #f5c6c6; color:var(--red); padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s; }
.btn-del:hover { background:#f5c6c6; }

/* Empty */
.empty-mini { padding:16px; text-align:center; color:var(--text-light); font-size:12px; }

/* Toast */
.profile-avatar:hover::after {
  content: '📷';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.toast { position:fixed; bottom:28px; right:24px; background:var(--forest); color:white; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:999; display:none; box-shadow:var(--shadow-md); }

/* Responsive */
@media(max-width:600px){ .profile-fields,.form-grid{grid-template-columns:1fr} .profile-banner{padding:20px 18px 18px} }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="header-brand">
    <img src="icon-192.png" alt="">
    <div><div class="hd-title">La Lysardière</div><div class="hd-sub" id="hd-sub">Animateurs</div></div>
  </a>
  <div class="header-right">
    <span id="autosave-indicator" style="display:none;font-size:12px;color:rgba(255,255,255,0.7);align-items:center;gap:5px">✓ Sauvegardé</span>
    <a href="animateur.html" class="hdr-btn hdr-ghost" id="btn-back-list" style="display:none">← Animateurs</a>
    <a href="documents_vierges.html" class="hdr-btn hdr-ghost" id="btn-vierges" style="display:none">📋 Documents vierges</a>
    <a href="index.html" class="hdr-btn hdr-ghost" id="btn-accueil" style="display:none">← Accueil</a>
  </div>
</div>

<!-- ══ LISTE MODE ══ -->
<div class="main" id="main-liste" style="display:none">
  <div class="liste-search-bar">
    <input class="search-input" id="search-anim" type="text" placeholder="🔍 Rechercher un animateur…" oninput="filtrerListe()">
    <button class="btn-create" onclick="ouvrirCreation()">➕ Nouvel animateur</button>
  </div>

  <div class="form-creation" id="form-creation">
    <div class="form-title">Nouvel animateur</div>

      <div class="field-group"><label>Prénom *</label><input class="field-input" id="new-prenom" type="text" placeholder="Prénom"></div>

      <button class="btn-sm btn-ghost-sm" onclick="document.getElementById('form-creation').style.display='none'">Annuler</button>
    </div>
  </div>

  <div id="anim-stats" style="font-size:12px;color:var(--text-mid);margin-bottom:12px;display:none"></div>
  <div id="animateurs-liste"></div>
</div>

<!-- ══ FICHE MODE ══ -->
<div class="main" id="main" style="display:none">

  <!-- Bannière profil -->
  <div class="profile-banner">
    <div class="profile-top">
      <label class="profile-avatar" id="avatar" title="Changer la photo" style="cursor:pointer;overflow:hidden;position:relative">
        <span id="avatar-initials">?</span>
        <img id="avatar-img" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%">
        <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="uploadPhoto()">
      </label>
      <div class="profile-title">
        <div class="profile-name" id="profile-name">Chargement…</div>
        <div class="profile-subtitle">Animateur · La Lysardière</div>
      </div>
    </div>
    <div class="profile-fields">
      <div class="profile-field">
        <label>Prénom</label>
        <input id="f-prenom" type="text" placeholder="Prénom" onblur="autosave()">
      </div>
      <div class="profile-field">
        <label>Nom</label>
        <input id="f-nom" type="text" placeholder="NOM" onblur="autosave()">
      </div>
      <div class="profile-field">
        <label>Email</label>
        <input id="f-email" type="email" placeholder="email@exemple.com" onblur="autosave()">
      </div>
      <div class="profile-field">
        <label>Téléphone</label>
        <input id="f-tel" type="tel" placeholder="06 XX XX XX XX" onblur="autosave()">
      </div>
      <div class="profile-field">
        <label>Date de naissance</label>
        <input id="f-ddn" type="date" onblur="autosave()">
      </div>
      <div class="profile-field">
        <label>Lieu de naissance</label>
        <input id="f-lbn" type="text" placeholder="Ville, Pays" onblur="autosave()">
      </div>
      <div class="profile-field full">
        <label>N° Sécurité sociale</label>
        <input id="f-nss" type="text" placeholder="1 85 06 75 123 456 78" onblur="autosave()">
      </div>
      <div class="profile-field full">
        <label>Adresse postale</label>
        <input id="f-adresse" type="text" placeholder="Rue, code postal, ville" onblur="autosave()">
      </div>
      <div class="profile-field full">
        <label>Notes</label>
        <input id="f-notes" type="text" placeholder="Observations…" onblur="autosave()">
      </div>
    </div>
    <div class="mail-bar" id="mail-bar">
      <a id="btn-mail-rib" class="mail-btn" href="#">📧 Demande RIB</a>
      <a id="btn-mail-contrat" class="mail-btn" href="#">📄 Envoyer contrat</a>
      <a id="btn-mail-docs" class="mail-btn" href="#">📋 Demande documents</a>
    </div>
  </div>

  <!-- Documents reçus -->
  <div class="section">
    <div class="section-head">
      <div class="section-head-title">📁 Documents reçus <span class="count-badge" id="docs-count">0</span></div>
    </div>
    <div class="section-body">
      <!-- Type selector au-dessus -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <label style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.7px">Type :</label>
        <select id="upload-type" class="select-input">
          <option value="cv">CV</option>
          <option value="cni">Carte d'identité</option>
          <option value="casier">Casier judiciaire</option>
          <option value="rib">RIB</option>
          <option value="contrat">Contrat signé</option>
          <option value="divers">Divers</option>
        </select>
        <span id="upload-status" class="upload-status"></span>
      </div>
      <!-- Zone drag & drop -->
      <div id="drop-zone"
        style="border:2px dashed var(--border);border-radius:10px;padding:18px 16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px;background:var(--card2)"

      </div>
    </div>
    <div class="section-body" id="docs-section" style="padding-top:0">
      <div class="empty-mini">Aucun document reçu.</div>
    </div>
  </div>



</div>

const _supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,storageKey:'lys_session',storage:localStorage,autoRefreshToken:true}});
let animateurId=null, animateur=null, allDocs=[], allVierges=[];

async function getJWT(){try{const{data:{session}}=await _supa.auth.getSession();if(session?.access_token)return session.access_token;}catch(e){}return SUPABASE_ANON;}
async function api(path,method,body){
  const jwt=await getJWT();
  const h={apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'};
  if(method&&method!=='GET')h.Prefer='return=representation';
  const opts={method:method||'GET',headers:h};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);
  if(!method||method==='GET'){const t=await r.text();return t?JSON.parse(t):[];}
  return r.ok;
}

async function init(){
  const{data:{session}}=await _supa.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  const params=new URLSearchParams(window.location.search);
  animateurId=params.get('id');
  if(!animateurId){
    // Mode liste — afficher tous les animateurs
    await chargerListe();
    return;
  }
  document.getElementById('main').style.display='block';
  document.getElementById('autosave-indicator').style.display='none'; // ready
  document.getElementById('btn-back-list').style.display='inline-flex';
  await charger();
}

async function chargerListe(){
  document.getElementById('main-liste').style.display='block';
  document.getElementById('btn-accueil').style.display='inline-flex';
  document.getElementById('btn-vierges').style.display='inline-flex';
  document.querySelector('.hd-sub').textContent='Liste animateurs';
  const data=await api('animateurs?select=*&order=nom.asc,prenom.asc');
  window._allAnimateurs=data||[];
  filtrerListe();
}

function filtrerListe(){
  const q=(document.getElementById('search-anim')?.value||'').toLowerCase();
  const list=window._allAnimateurs||[];
  const filtered=q?list.filter(a=>`${a.prenom} ${a.nom} ${a.email}`.toLowerCase().includes(q)):list;
  const el=document.getElementById('animateurs-liste');
  const stats=document.getElementById('anim-stats');
  if(stats){stats.style.display='block';stats.textContent=filtered.length+' animateur'+(filtered.length>1?'s':'')+' · '+(window._allAnimateurs||[]).length+' au total';}
  if(!filtered.length){
    el.innerHTML='<div class="empty-mini">Aucun animateur trouvé.</div>';
    return;
  }
  el.innerHTML=filtered.map(a=>{
    const initials=((a.prenom||'')[0]||'')+((a.nom||'')[0]||'');
    return `<div style="background:var(--card);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:8px;border:1px solid var(--border-light);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow)"
      onclick="window.location.href='animateur.html?id=${a.id}'"
      onmouseover="this.style.background='var(--mint)'" onmouseout="this.style.background='var(--card)'">
      <div id="list-av-${a.id}" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--forest),var(--forest-mid));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:white;flex-shrink:0;overflow:hidden;position:relative">
        <span>${initials.toUpperCase()||'?'}</span>
        <img id="list-img-${a.id}" src="" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px">${a.prenom} ${(a.nom||'').toUpperCase()}</div>
        <div style="font-size:12px;color:var(--text-mid)">${[a.email,a.telephone].filter(Boolean).join(' · ')||'Aucune coordonnée'}</div>
      </div>
      <span style="font-size:12px;color:var(--text-light)">→</span>
    </div>`;
  }).join('');
  // Charger les photos en arrière-plan
  filtered.filter(a=>a.photo_path).forEach(a=>chargerPhotoListe(a));
}

async function chargerPhotoListe(a){
  try{
    const jwt=await getJWT();
    const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/animateurs/${a.photo_path}`,{
      method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})
    });
    if(!r.ok) return;
    const data=await r.json();
    const url=data.signedURL?.startsWith('http')?data.signedURL:`${SUPABASE_URL}/storage/v1${data.signedURL}`;
    const img=document.getElementById('list-img-'+a.id);
    if(img){img.src=url;img.style.display='block';}
  }catch(e){}
}

function ouvrirCreation(){
  document.getElementById('form-creation').style.display='block';
  document.getElementById('new-prenom').focus();
}

async function creerAnimateur(){
  const prenom=document.getElementById('new-prenom').value.trim();
  const nom=document.getElementById('new-nom').value.trim().toUpperCase();
  if(!prenom||!nom){alert('Prénom et nom requis.');return;}
  const jwt=await getJWT();
  const r=await fetch(SUPABASE_URL+'/rest/v1/animateurs',{
    method:'POST',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({prenom,nom,email:document.getElementById('new-email').value.trim(),telephone:document.getElementById('new-tel').value.trim(),notes:''})
  });
  const data=await r.json();
  const newAnim=data&&data[0];
  if(newAnim) window.location.href='animateur.html?id='+newAnim.id;
  else alert('Erreur lors de la création.');
}

async function loadPhoto(){
  if(!animateur?.photo_path) return;
  try{
    const jwt=await getJWT();
    const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/animateurs/${animateur.photo_path}`,{
      method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'},
      body:JSON.stringify({expiresIn:3600})
    });
    if(!r.ok) return;
    const data=await r.json();
    const signedURL = data.signedURL?.startsWith('http')
      ? data.signedURL
      : `${SUPABASE_URL}/storage/v1${data.signedURL}`;
    showPhoto(signedURL);
  }catch(e){}
}

function showPhoto(url){
  const img=document.getElementById('avatar-img');
  const initEl=document.getElementById('avatar-initials');
  if(img){img.src=url;img.style.display='block';}
  if(initEl)initEl.style.display='none';
}

async function uploadPhoto(){
  const file=document.getElementById('avatar-file').files[0];
  if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase()||'jpg';
  const jwt=await getJWT();
  const path=`photos/${animateurId}.${ext}`;
  // Supprimer l'ancienne photo si différente extension
  if(animateur?.photo_path && animateur.photo_path!==path){
    await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${animateur.photo_path}`,{
      method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}
    });
  }
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${path}`,{
    method:'POST',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':file.type,'x-upsert':'true'},
    body:file
  });
  if(r.ok){
    // Sauvegarder le chemin dans la table animateurs
    await fetch(SUPABASE_URL+'/rest/v1/animateurs?id=eq.'+animateurId,{
      method:'PATCH',
      headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({photo_path:path})
    });
    animateur.photo_path=path;
    showPhoto(URL.createObjectURL(file));
    toast('✅ Photo mise à jour');
  } else {
    const txt=await r.text();
    console.error('Upload photo error:',r.status,txt);
    toast('❌ Erreur upload photo','error');
  }
}

let _autosaveTimer=null;
function autosave(){
  clearTimeout(_autosaveTimer);
  _autosaveTimer=setTimeout(()=>sauvegarder(),800);
}
function showAutosaved(){
  const el=document.getElementById('autosave-indicator');
  if(!el) return;
  el.style.display='inline-flex';
  clearTimeout(el._hide);
  el._hide=setTimeout(()=>{el.style.display='none';},2500);
}

function handleDrop(event){
  event.preventDefault();
  const dz=document.getElementById('drop-zone');
  if(dz){dz.style.background='var(--card2)';dz.style.borderColor='var(--border)';}
  const file=event.dataTransfer.files[0];
  if(!file) return;
  // Injecter le fichier dans l'input et déclencher l'upload
  const dt=new DataTransfer();dt.items.add(file);
  const inp=document.getElementById('upload-file');
  inp.files=dt.files;
  uploadDoc();
}

async function changeDocType(docId, newType){
  const jwt=await getJWT();
  await fetch(SUPABASE_URL+'/rest/v1/animateur_documents?id=eq.'+docId,{
    method:'PATCH',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({type:newType})
  });
  // Mettre à jour localement sans re-render complet
  const doc=allDocs.find(d=>d.id===docId);
  if(doc){
    doc.type=newType;
    // Mettre à jour le style du select
    const sel=document.querySelector(`#doc-item-${docId} select`);
    if(sel){sel.style.background=TYPE_BG[newType]||'#f3f4f6';sel.style.color=TYPE_COLOR[newType]||'#374151';}
  }
}

async function charger(){
  const[anim,docs]=await Promise.all([
    api('animateurs?id=eq.'+animateurId+'&select=*'),
    api('animateur_documents?animateur_id=eq.'+animateurId+'&select=*&order=uploaded_at.desc'),
  ]);
  animateur=(anim||[])[0]||null;
  allDocs=docs||[];
  if(!animateur){toast('Animateur introuvable','error');return;}
  renderProfil();
  renderDocs();
}

function renderProfil(){
  const p=animateur;
  const initials=((p.prenom||'')[0]||'')+((p.nom||'')[0]||'');
  document.getElementById('avatar-initials').textContent=initials.toUpperCase()||'?';
  // Charger la photo si elle existe
  loadPhoto();
  document.getElementById('profile-name').textContent=(p.prenom||'')+' '+(p.nom||'').toUpperCase();
  document.getElementById('f-prenom').value=p.prenom||'';
  document.getElementById('f-nom').value=p.nom||'';
  document.getElementById('f-email').value=p.email||'';
  document.getElementById('f-tel').value=p.telephone||'';
  document.getElementById('f-ddn').value=p.date_naissance||'';
  document.getElementById('f-lbn').value=p.lieu_naissance||'';
  document.getElementById('f-nss').value=p.num_secu||'';
  document.getElementById('f-adresse').value=p.adresse||'';
  document.getElementById('f-notes').value=p.notes||'';
  document.title=(p.prenom||'')+' '+(p.nom||'')+' — La Lysardière';
  document.getElementById('hd-sub').textContent=(p.prenom||'')+' '+(p.nom||'').toUpperCase();
  // Boutons mail
  if(p.email){
    document.getElementById('mail-bar').style.display='flex';
    const nom=encodeURIComponent((p.prenom||'')+' '+(p.nom||''));
    document.getElementById('btn-mail-rib').href=`mailto:${p.email}?subject=Demande%20RIB%20%E2%80%94%20La%20Lysardi%C3%A8re&body=Bonjour%20${nom}%2C%0A%0ANous%20vous%20demandons%20de%20bien%20vouloir%20nous%20transmettre%20votre%20RIB%20afin%20de%20proc%C3%A9der%20%C3%A0%20votre%20paiement.%0A%0ACordialement%2C%0AL%27%C3%A9quipe%20La%20Lysardi%C3%A8re`;
    document.getElementById('btn-mail-contrat').href=`mailto:${p.email}?subject=Contrat%20%E2%80%94%20La%20Lysardi%C3%A8re&body=Bonjour%20${nom}%2C%0A%0AVeuillez%20trouver%20ci-joint%20votre%20contrat%20pour%20la%20prochaine%20session.%0A%0ACordialement%2C%0AL%27%C3%A9quipe%20La%20Lysardi%C3%A8re`;
    document.getElementById('btn-mail-docs').href=`mailto:${p.email}?subject=Documents%20requis%20%E2%80%94%20La%20Lysardi%C3%A8re&body=Bonjour%20${nom}%2C%0A%0ANous%20avons%20besoin%20des%20documents%20suivants%20%3A%20CV%2C%20carte%20d%27identit%C3%A9%2C%20casier%20judiciaire%20vierge%2C%20RIB.%0A%0ACordialement%2C%0AL%27%C3%A9quipe%20La%20Lysardi%C3%A8re`;
  }
}

function renderDocs(){
  document.getElementById('docs-count').textContent=allDocs.length;
  const section=document.getElementById('docs-section');
  if(!allDocs.length){section.innerHTML='<div class="empty-mini">Aucun document reçu.</div>';return;}
  const byType={};
  TYPE_ORDER.forEach(t=>{byType[t]=allDocs.filter(d=>d.type===t);});
  section.innerHTML=TYPE_ORDER.filter(t=>byType[t].length).map(t=>{
    const rows=byType[t].map(doc=>`
      <div class="doc-item" id="doc-item-${doc.id}">
        <select onchange="changeDocType('${doc.id}',this.value)"
          style="padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;background:${TYPE_BG[doc.type]||'#f3f4f6'};color:${TYPE_COLOR[doc.type]||'#374151'}">
          ${Object.entries(TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${k===doc.type?'selected':''}>${v}</option>`).join('')}
        </select>
        <span class="doc-name">${doc.filename}</span>
        <span class="doc-date">${fmtDate(doc.uploaded_at)}</span>
        <button class="btn-icon" onclick="openDoc('${doc.storage_path}','${esc(doc.filename)}')">👁 Voir</button>
        <button class="btn-del" onclick="deleteDoc('${doc.id}','${doc.storage_path}')">🗑</button>
      </div>`).join('');
    return `<div class="doc-type-group">
      <div class="doc-type-label-row">${TYPE_LABELS[t]||t} (${byType[t].length})</div>
      ${rows}
    </div>`;
  }).join('');
}

function renderVierges(){
  const section=document.getElementById('vierges-section');
  document.getElementById('vierges-count').textContent=allVierges.length;
  if(!allVierges.length){section.innerHTML='<div class="empty-mini">Aucun document vierge.</div>';return;}
  section.innerHTML=allVierges.map(v=>`
    <div class="vierge-item">
      <span class="vierge-icon">📄</span>
      <span class="vierge-label">${v.label}</span>
      <button class="btn-icon" onclick="openDoc('${v.storage_path}','${esc(v.label)}')">⬇️ Télécharger</button>
      <button class="btn-del" onclick="deleteVierge('${v.id}','${v.storage_path}')">🗑</button>
    </div>`).join('');
}

// ── SAVE ─────────────────────────────────────────────────────────
async function sauvegarder(){
  const jwt=await getJWT();
  const data={
    prenom:document.getElementById('f-prenom').value.trim(),
    nom:document.getElementById('f-nom').value.trim().toUpperCase(),
    email:document.getElementById('f-email').value.trim(),
    telephone:document.getElementById('f-tel').value.trim(),
    date_naissance:document.getElementById('f-ddn').value||null,
    lieu_naissance:document.getElementById('f-lbn').value.trim(),
    num_secu:document.getElementById('f-nss').value.trim(),
    adresse:document.getElementById('f-adresse').value.trim(),
    notes:document.getElementById('f-notes').value.trim(),
    updated_at:new Date().toISOString()
  };
  const r=await fetch(SUPABASE_URL+'/rest/v1/animateurs?id=eq.'+animateurId,{
    method:'PATCH',
    headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(data)
  });
  if(r.ok){animateur={...animateur,...data};renderProfil();showAutosaved();}
  else toast('Erreur lors de la sauvegarde','error');
}

// ── UPLOAD DOC ───────────────────────────────────────────────────
async function uploadDoc(){
  const file=document.getElementById('upload-file').files[0];
  if(!file) return;
  const type=document.getElementById('upload-type').value;
  const status=document.getElementById('upload-status');
  status.textContent='Envoi en cours…';
  const jwt=await getJWT();
  const path=`animateurs/${animateurId}/${Date.now()}_${file.name}`;
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${path}`,{
    method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':file.type},
    body:file
  });
  if(!r.ok){status.textContent='❌ Erreur upload';return;}
  await api('animateur_documents','POST',{animateur_id:animateurId,type,filename:file.name,storage_path:path});
  status.textContent='✅ Ajouté';
  document.getElementById('upload-file').value='';
  setTimeout(()=>{status.textContent='';},2000);
  await charger();
}

// ── UPLOAD VIERGE ────────────────────────────────────────────────
async function uploadVierge(){
  const file=document.getElementById('vierge-file').files[0];
  const label=document.getElementById('vierge-label').value.trim();
  if(!file||!label){alert('Nom et fichier requis.');return;}
  const status=document.getElementById('vierge-status');
  status.textContent='Envoi en cours…';
  const jwt=await getJWT();
  const path=`vierges/${Date.now()}_${file.name}`;
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${path}`,{
    method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':file.type},
    body:file
  });
  if(!r.ok){status.textContent='❌ Erreur upload';return;}
  await api('documents_vierges','POST',{label,storage_path:path});
  status.textContent='✅ Ajouté';
  document.getElementById('vierge-file').value='';
  document.getElementById('vierge-label').value='';
  setTimeout(()=>{status.textContent='';},2000);
  await charger();
}

// ── OPEN / DELETE ─────────────────────────────────────────────────
async function openDoc(path, filename){
  const jwt=await getJWT();
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/animateurs/${path}`,{
    method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'},
    body:JSON.stringify({expiresIn:3600})
  });
  if(!r.ok){alert('Impossible d\'ouvrir le document.');return;}
  const data=await r.json();
  const signedURL = data.signedURL?.startsWith('http')
    ? data.signedURL
    : `${SUPABASE_URL}/storage/v1${data.signedURL}`;
  window.open(signedURL,'_blank');
}

async function deleteDoc(id, path){
  if(!confirm('Supprimer ce document ?')) return;
  const jwt=await getJWT();
  await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${path}`,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});
  await fetch(SUPABASE_URL+'/rest/v1/animateur_documents?id=eq.'+id,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});
  await charger();
}

async function deleteVierge(id, path){
  if(!confirm('Supprimer ce document vierge ?')) return;
  const jwt=await getJWT();
  await fetch(`${SUPABASE_URL}/storage/v1/object/animateurs/${path}`,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});
  await fetch(SUPABASE_URL+'/rest/v1/documents_vierges?id=eq.'+id,{method:'DELETE',headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${jwt}`}});
  await charger();
}

// ── UTILS ─────────────────────────────────────────────────────────
function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';el.style.background=type==='error'?'#c0392b':'var(--forest)';setTimeout(()=>{el.style.display='none';},3000);}

init();

</script>
